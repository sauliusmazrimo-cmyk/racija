name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK licencijos
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Kompiliuoti APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Paruošti failus
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk 311VoiceCH.apk
          # versijos informacija programėlei: ji palygina su savo numeriu ir pasiūlo atnaujinti
          python3 - <<'PY'
          import json, os
          notes = open('android/RELEASE_NOTES.txt', encoding='utf-8').read().strip() if os.path.exists('android/RELEASE_NOTES.txt') else ''
          n = int(os.environ['GITHUB_RUN_NUMBER'])
          json.dump({'code': n, 'name': f'1.0.{n}', 'notes': notes}, open('version.json', 'w', encoding='utf-8'), ensure_ascii=False)
          PY
          cat version.json

      - name: Įkelti į Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 311 VoiceCH Android
          make_latest: true
          overwrite_files: true
          files: |
            311VoiceCH.apk
            version.json
          body: |
            311 VoiceCH Android programėlė (build ${{ github.run_number }}).
            Parsisiųsti telefone: https://racija-production.up.railway.app/apk
