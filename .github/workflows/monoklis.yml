name: Monoklio programa

on:
  push:
    branches: [main]
    paths: ['firmware/**', '.github/workflows/monoklis.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: arduino/setup-arduino-cli@v2

      - name: ESP32 branduolys ir bibliotekos
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.1.3
          arduino-cli lib install "U8g2" "SparkFun BNO08x Cortex Based IMU"

      - name: Kompiliuoti
        run: |
          arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32C3 --output-dir build --warnings default firmware/monoklis
          ls -la build
          cp build/monoklis.ino.merged.bin monoklis.bin
          echo "{\"version\":\"${{ github.run_number }}\"}" > monoklis.json

      - name: Įkelti į Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: monoklis-latest
          name: 311 VoiceCH monoklio programa
          make_latest: false
          overwrite_files: true
          files: |
            monoklis.bin
            monoklis.json
          body: |
            XIAO ESP32C3 monoklio programa (build ${{ github.run_number }}).
            Įrašyti per naršyklę: https://racija-production.up.railway.app/monoklis
