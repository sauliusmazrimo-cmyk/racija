<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>311 VoiceCH</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-title" content="311 VoiceCH">
<script src="/qrcode.js"></script>
<style>
:root{
  --bg:#0b0f14; --panel:#121820; --panel2:#18202a; --line:#1f2833; --text:#e6edf3; --muted:#7d8a99;
  --accent:#ff8a1f; --accent2:#ffb347; --ok:#2ecc71; --busy:#e74c3c; --rx:#3fa9f5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.hidden{display:none!important}
button{font:inherit;cursor:pointer}
.scr{flex:1;display:flex;flex-direction:column;max-width:520px;width:100%;margin:0 auto;min-height:0}

label{font-size:13px;color:var(--muted);display:block;margin:0 0 6px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  color:var(--text);font-size:17px;outline:none}
input:focus{border-color:var(--accent)}
.field{margin-bottom:14px}
.btn{width:100%;padding:15px;border:0;border-radius:12px;background:var(--accent);color:#111;font-weight:700;font-size:16px}
.btn.alt{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--busy);border:1px solid rgba(231,76,60,.5)}
.btn + .btn{margin-top:10px}
.err{color:var(--busy);font-size:14px;min-height:20px;margin-top:8px}
.muted{color:var(--muted);font-size:14px}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font-size:14px}
.icon{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--text);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}

/* vardo ekranas */
#scrName{justify-content:center}
#scrName h1{margin:0 0 6px;font-size:36px}
#scrName h1 span,.brand span{color:var(--accent)}
#scrName p{margin:0 0 24px}

/* kanalų sąrašas */
.top{display:flex;align-items:center;gap:10px;padding:16px 0 12px}
.top .grow{flex:1;min-width:0}
.brand{font-weight:800;font-size:22px}
.hello{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chList{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
#chList li{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--panel);
  border:1px solid var(--line);margin-bottom:8px}
#chList li .nm{flex:1;min-width:0;font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis}
#chList li .nm small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
#chList li .av{width:40px;height:40px;border-radius:12px;background:rgba(255,138,31,.15);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
#chList li .x{background:none;border:0;color:var(--muted);font-size:18px;padding:6px}
.emptyBox{text-align:center;padding:40px 10px;color:var(--muted)}
.emptyBox b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 0 16px}
.actions .btn + .btn{margin-top:0}

/* kanalas */
.dot{width:10px;height:10px;border-radius:50%;background:var(--busy);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.chTitle{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#status{height:52px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:600;transition:.15s;padding:0 10px;text-align:center}
#status.rx{background:rgba(63,169,245,.15);border-color:var(--rx);color:var(--rx)}
#status.tx{background:rgba(255,138,31,.15);border-color:var(--accent);color:var(--accent)}
#status.busy{background:rgba(231,76,60,.15);border-color:var(--busy);color:var(--busy)}
#pttWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:220px}
#ptt{width:min(60vw,230px);height:min(60vw,230px);border-radius:50%;border:0;
  background:radial-gradient(circle at 35% 30%,var(--accent2),var(--accent) 60%,#c25d00);
  color:#1a1a1a;font-size:20px;font-weight:800;letter-spacing:1px;
  box-shadow:0 10px 40px rgba(255,138,31,.35),inset 0 -6px 0 rgba(0,0,0,.2);
  user-select:none;-webkit-user-select:none;touch-action:none;transition:transform .08s}
#ptt.down{transform:scale(.94);box-shadow:0 0 0 14px rgba(255,138,31,.18),0 0 60px rgba(255,138,31,.6)}
#ptt.locked{background:#2a3340;color:var(--muted);box-shadow:none}
#ptt small{display:block;font-size:12px;font-weight:600;opacity:.7;margin-top:6px}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:10px 0 8px;display:flex;justify-content:space-between}
#users{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.chip.talk{border-color:var(--rx);color:var(--rx)}
#hist{list-style:none;margin:0;padding:0 0 16px;overflow-y:auto;max-height:30vh}
#hist li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);margin-bottom:6px}
#hist li .who{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hist li .t{color:var(--muted);font-size:13px;white-space:nowrap}
#hist li button{width:40px;height:40px;border-radius:50%;border:0;background:var(--line);color:var(--text);font-size:15px;flex:none}
#hist li.playing button{background:var(--rx);color:#000}
#hist .none{background:none;border:0;color:var(--muted);font-size:14px;padding:4px 0}

/* modalas */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:22;
  padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
#modal .box{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;
  max-height:90vh;overflow-y:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#modal h2{margin:0 0 16px;font-size:20px}
.menuItem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:12px;
  background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:16px;margin-bottom:8px}
.menuItem.red{color:var(--busy)}
.menuItem small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.qr{background:#fff;border-radius:14px;padding:12px;width:220px;margin:0 auto 14px}
.qr svg{display:block;width:100%;height:auto}
.linkBox{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;
  word-break:break-all;color:var(--muted);margin-bottom:12px}
.cred{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin-bottom:14px}
.cred span{color:var(--muted)}
.chip.own::before{content:'👑 '}
.chip.tap{cursor:pointer}
.adRow{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.adTop{display:flex;justify-content:space-between;align-items:center;font-size:16px}
.adTop .on{color:var(--ok);font-size:13px;font-weight:600}
.adMeta{font-size:12px;margin:2px 0 10px}
.adBtns{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px}
.adBtns .btn{padding:10px 6px;font-size:14px;margin:0}
/* komandos */
#cmdBar{margin-top:10px}
#stopBtn{position:relative;overflow:hidden;width:100%;height:58px;border:0;border-radius:14px;background:#7a1d16;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;letter-spacing:.5px;
  user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:inset 0 0 0 2px rgba(255,90,70,.5)}
#stopBtn b,#stopBtn small{position:relative;z-index:1}
#stopBtn small{font-size:12px;opacity:.75}
#stopBtn .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#e74c3c}
#stopBtn.hold .fill{width:100%;transition:width 1s linear}
#cmdChips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
#cmdChips::-webkit-scrollbar{display:none}
#cmdChips{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.cmdChip{flex:none;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,138,31,.45);background:rgba(255,138,31,.12);
  color:var(--text);font-weight:700;font-size:15px;white-space:nowrap}
.cmdChip.edit{border-color:var(--line);background:var(--panel);color:var(--muted);font-weight:500}
.cmdChip:active{transform:scale(.96)}
#hist li.cmd .who{color:var(--accent2)}
#hist li.alarm{border-color:rgba(231,76,60,.6);background:rgba(231,76,60,.12)}
#hist li.alarm .who{color:#ff6b5b}
/* signalas */
#alarm{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:#b3160c;color:#fff;text-align:center;padding:24px;animation:flashA .5s steps(1) infinite}
@keyframes flashA{50%{background:#3a0603}}
#alarm .big{font-size:72px;font-weight:900;letter-spacing:2px}
#alarm .txt{font-size:28px;font-weight:800}
#alarm .from{font-size:18px;opacity:.85}
#alarm button{margin-top:30px;padding:18px 40px;border:0;border-radius:16px;background:#fff;color:#b3160c;font-size:20px;font-weight:900}
#cmdBanner{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));z-index:25;padding:16px 18px;border-radius:16px;
  background:#ff8a1f;color:#111;box-shadow:0 10px 40px rgba(0,0,0,.5);text-align:center;animation:up .18s ease-out}
#cmdBanner b{display:block;font-size:24px}
#cmdBanner small{font-size:14px;opacity:.8}
.cmdRow{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
.cmdRow input{flex:1;min-width:0;padding:10px;font-size:15px}
.cmdRow button{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:17px}
.cmdRow button.rec{background:#7a1d16;border-color:#e74c3c}
.cmdRow button.rec.on{background:#e74c3c;animation:flashA .6s steps(1) infinite}
.cmdRow button.has{border-color:var(--ok)}
.meshCard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:10px}
.meshCard.ok{border-color:rgba(46,204,113,.5);background:rgba(46,204,113,.08)}
.meshCard .mi{font-size:22px}
.meshCard .mt{flex:1;min-width:0}
.meshCard .mt b{display:block;font-size:15px}
.meshCard .mt small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
#meshBox #cmdBar{margin:0 0 12px}
#meshDot{font-size:13px;margin-left:2px}
#meshDot.off{display:none}
#meshDot.warn{opacity:.35;filter:grayscale(1)}
select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:17px}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:14px;color:var(--text);font-size:15px}
.check input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.check small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
#updBar{display:flex;align-items:center;gap:12px;width:100%;max-width:520px;margin:10px auto 0;padding:12px 14px;border-radius:14px;
  border:1px solid rgba(63,169,245,.5);background:rgba(63,169,245,.12);color:var(--text);text-align:left;flex:none}
#updBar .ui{font-size:22px}
#updBar .ut{flex:1;min-width:0}
#updBar .ut b{display:block;font-size:15px}
#updBar .ut small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
#updBar .ub{flex:none;padding:9px 12px;border-radius:10px;background:var(--rx);color:#001018;font-weight:800;font-size:14px}
#timerCard{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid rgba(63,169,245,.45);cursor:pointer}
#timerCard .tTop{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
#timerCard #tTitle{color:var(--text);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tLeft{font-size:38px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;margin:2px 0 8px;color:var(--rx)}
.tBar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.tBar i{display:block;height:100%;width:0;background:var(--rx);transition:width .5s linear}
#timerCard.warn{border-color:rgba(255,138,31,.6)} #timerCard.warn #tLeft{color:var(--accent)} #timerCard.warn .tBar i{background:var(--accent)}
#timerCard.crit{border-color:rgba(231,76,60,.7)} #timerCard.crit #tLeft{color:#ff6b5b} #timerCard.crit .tBar i{background:var(--busy)}
#timerCard.done{border-color:var(--busy);animation:tdone 1s steps(1) infinite} #timerCard.done #tLeft{color:#ff6b5b;font-size:28px} #timerCard.done .tBar i{background:var(--busy)}
@keyframes tdone{50%{background:rgba(231,76,60,.18)}}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.quick button{padding:12px 4px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:700;font-size:15px}
.quick button.on{border-color:var(--accent);background:rgba(255,138,31,.15)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#mapBtn{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:5px 10px;font-size:12px;letter-spacing:0;text-transform:none}
#mapBtn.on{border-color:var(--ok);color:var(--ok)}
#mapView{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.mapTop{display:flex;align-items:center;gap:10px;padding:10px 16px}
.mapTop .grow{flex:1;min-width:0}
.mapTop b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapTop small{display:block;color:var(--muted);font-size:12px}
.shareBtn{flex:none;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-weight:700;font-size:14px}
.shareBtn.on{border-color:var(--ok);background:rgba(46,204,113,.15);color:var(--ok)}
#map{flex:1;min-height:200px;background:#1a2230}
#mapList{max-height:34vh;overflow-y:auto;padding:8px 16px 12px}
.pRow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
  color:var(--text);margin-bottom:6px;text-align:left}
.pRow .pd{width:12px;height:12px;border-radius:50%;flex:none}
.pRow .pn{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pRow .pi{color:var(--muted);font-size:13px;white-space:nowrap}
.leaflet-tooltip.mapLbl{background:rgba(11,15,20,.85);color:#fff;border:0;border-radius:8px;padding:2px 7px;font-weight:700;box-shadow:none}
.leaflet-tooltip.mapLbl:before{display:none}
#meetCard{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:10px 14px;border-radius:14px;background:var(--panel);
  border:1px solid rgba(231,76,60,.45);color:var(--text);text-align:left}
#meetCard .mf{font-size:22px}
#meetCard .mt2{flex:1;min-width:0}
#meetCard b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#meetCard small{display:block;color:var(--muted);font-size:13px}
#mtArrow{font-size:26px;font-weight:900;color:var(--accent);transition:transform .4s;flex:none;width:30px;text-align:center}
#placeHint{padding:10px 16px;background:rgba(231,76,60,.18);color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;justify-content:space-between}
#placeHint button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:5px 10px}
.flagIcon{font-size:30px;line-height:30px;text-align:center;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.leaflet-tooltip.distLbl{background:#3fa9f5;color:#001018;border:0;border-radius:8px;padding:2px 8px;font-weight:800;box-shadow:none}
.leaflet-tooltip.distLbl:before{display:none}
.leaflet-tooltip.flagLbl{background:#b3160c;color:#fff;border:0;border-radius:8px;padding:2px 8px;font-weight:800;box-shadow:none}
.leaflet-tooltip.flagLbl:before{display:none}
.pRow.meet{border-color:rgba(231,76,60,.5)}
.apkBanner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;margin-bottom:10px;text-decoration:none;
  background:rgba(255,138,31,.1);border:1px solid rgba(255,138,31,.35);color:var(--text);font-size:22px}
.apkBanner b{display:block;font-size:15px}
.apkBanner small{display:block;font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#243040;
  color:var(--text);padding:12px 18px;border-radius:12px;font-size:14px;z-index:40;transition:opacity .2s;pointer-events:none}
</style>
</head>
<body>

<!-- 1. Vardas -->
<section id="scrName" class="scr hidden">
  <h1><span>311</span> VoiceCH</h1>
  <p class="muted">Kaip tave matys kiti kanalo nariai?</p>
  <div class="field">
    <label for="nameIn">Vardas</label>
    <input id="nameIn" autocomplete="name" maxlength="32" placeholder="pvz. Saulius">
  </div>
  <button class="btn" id="nameBtn">Toliau</button>
  <div class="err" id="nameErr"></div>
</section>

<!-- 2. Kanalų sąrašas -->
<button id="updBar" class="hidden"><span class="ui">🔄</span><span class="ut"><b>Yra nauja programėlės versija</b><small id="updNotes"></small></span><span class="ub">Atnaujinti</span></button>

<section id="scrList" class="scr hidden">
  <div class="top">
    <div class="grow"><div class="brand"><span>311</span> VoiceCH</div><div class="hello" id="hello"></div></div>
    <button class="icon" id="adminBtn" aria-label="Administratorius">🛡️</button>
    <button class="ghost" id="logoutBtn">Atsijungti</button>
  </div>
  <div class="sec"><span>Mano kanalai</span></div>
  <div id="meshBox" class="hidden"></div>
  <ul id="chList"></ul>
  <div class="actions">
    <button class="btn" id="newChBtn">＋ Sukurti</button>
    <button class="btn alt" id="joinChBtn">Prisijungti</button>
  </div>
</section>

<!-- 3. Kanalas -->
<section id="scrChan" class="scr hidden">
  <div class="top">
    <button class="icon" id="backBtn" aria-label="Atgal">←</button>
    <div class="grow"><div class="chTitle"><span class="dot" id="dot"></span><span id="chName"></span></div>
      <div class="hello" id="chSub"></div></div>
    <button class="icon" id="timerBtn" aria-label="Laikmatis">⏰</button>
    <button class="icon" id="inviteBtn" aria-label="Pakviesti">👥</button>
    <button class="icon" id="menuBtn" aria-label="Meniu">⋯</button>
  </div>

  <div id="status">Tylu</div>
  <div id="timerCard" class="hidden">
    <div class="tTop"><span id="tTitle">⏰</span><span id="tEnd"></span></div>
    <div id="tLeft">0:00:00</div>
    <div class="tBar"><i id="tFill"></i></div>
  </div>
  <button id="meetCard" class="hidden"><span class="mf">🚩</span><span class="mt2"><b id="mtTitle"></b><small id="mtInfo"></small></span><span id="mtArrow">↑</span></button>
  <div id="cmdBar">
    <button id="stopBtn"><span class="fill"></span><b>🚨 STOP VISIEMS</b><small>laikyk 1 s</small></button>
    <div id="cmdChips"></div>
  </div>

</div>

<script>
const RATE = 16000;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vib = p => { try{ navigator.vibrate && navigator.vibrate(p) }catch{} };
const store = {
  get(k,d=null){ try{ const v=localStorage.getItem(k); return v===null?d:v }catch{ return d } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch{} },
  del(k){ try{ localStorage.removeItem(k) }catch{} }
};

// ---------- vietiniai duomenys ----------
let myName = store.get('racija_name','');
let token = store.get('racija_token');
if (!token){ token = [...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join(''); store.set('racija_token',token); }
let saved = (()=>{ try{ return JSON.parse(store.get('racija_channels','[]'))||[] }catch{ return [] } })();
const saveList = () => store.set('racija_channels', JSON.stringify(saved));
const findSaved = n => saved.find(c=>c.name===n);
function upsertSaved(obj){
  const c = findSaved(obj.name);
  if (c) Object.assign(c,obj); else saved.unshift({hiddenBefore:0, ...obj});
  saveList();
}

// ---------- ekranai ----------
function show(id){ ['scrName','scrList','scrChan'].forEach(s=>$(s).classList.toggle('hidden', s!==id)); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.opacity=1; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.opacity=0,2000); }
function openModal(html){ $('modalBox').innerHTML=html; $('modal').classList.remove('hidden'); const f=$('modalBox').querySelector('input'); if(f) setTimeout(()=>f.focus(),50); }
function closeModal(){ $('modal').classList.add('hidden'); $('modalBox').innerHTML=''; pending=null; }
$('modal').addEventListener('pointerdown', e=>{ if(e.target.id==='modal') closeModal(); });

// ---------- mu-law ----------
const MU = new Int16Array(256);
for (let i=0;i<256;i++){ const u=~i&0xff; let t=((u&0x0f)<<3)+0x84; t<<=(u&0x70)>>4; MU[i]=(u&0x80)?(0x84-t):(t-0x84); }
function linToMu(s){
  let sign=(s>>8)&0x80; if(sign) s=-s; if(s>32635) s=32635; s+=0x84;
  let exp=7; for(let mask=0x4000;(s&mask)===0&&exp>0;exp--,mask>>=1);
  const mant=(s>>(exp+3))&0x0f;
  return ~(sign|(exp<<4)|mant)&0xff;
}

// ---------- garsas ----------
let ctx=null, stream=null, gainOut=null, talking=false, playHead=0, dsPos=0;
let proc=null, micSrc=null, micChain=null, recBuf=null;
let noisy = store.get('vc_noisy','0')==='1';   // triukšmingos aplinkos režimas
async function initAudio(){
  ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
  if (ctx.state==='suspended') await ctx.resume();
  if (!gainOut){ gainOut=ctx.createGain(); gainOut.gain.value=1.4; gainOut.connect(ctx.destination); }
  if (!proc){
    proc = ctx.createScriptProcessor(4096,1,1);
    const mute = ctx.createGain(); mute.gain.value=0;
    proc.connect(mute); mute.connect(ctx.destination);
    proc.onaudioprocess = e => {
      const live = talking && ws && ws.readyState===1;
      if (!recBuf && !live) return;
      const out = encode(e.inputBuffer.getChannelData(0));
      if (!out.length) return;
      if (recBuf) recBuf.push(out); else ws.send(out);
    };
  }
}

// Mikrofonas atidaromas TIK kalbant / įrašant. Nuolat atidarytas mikrofonas laiko telefoną
// „pokalbio“ režime, ir garso mygtukai nustoja valdyti įprastą garsumą.
let micIdle=null, micOpening=null;
async function openMic(){
  await initAudio();
  clearTimeout(micIdle);
  if (stream) return;
  if (micOpening) return micOpening;
  micOpening = (async()=>{
    // triukšme: be automatinio garsumo kėlimo (šūviai nesustiprinami) + ribotuvas smūginiams garsams
    const s = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:!noisy}});
    stream = s;
    micSrc = ctx.createMediaStreamSource(stream);
    if (noisy){
      micChain = ctx.createDynamicsCompressor();
      micChain.threshold.value=-30; micChain.knee.value=6; micChain.ratio.value=12; micChain.attack.value=0.002; micChain.release.value=0.15;
      const boost = ctx.createGain(); boost.gain.value=2.2;
      micSrc.connect(micChain); micChain.connect(boost); boost.connect(proc);
      micChain._out = boost;
    } else {
      micChain = null; micSrc.connect(proc);
    }
  })();
  try{ await micOpening; } finally { micOpening=null; }
}
function closeMic(force){
  clearTimeout(micIdle);
  if (!force && (talking || recBuf || ptt.classList.contains('down'))) return;
  if (stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  try{ micSrc && micSrc.disconnect(); }catch{}
  try{ micChain && micChain._out.disconnect(); }catch{}
  micSrc=null; micChain=null;
  if (window.Native311 && Native311.audioIdle) setTimeout(()=>{ try{ Native311.audioIdle(); }catch{} }, 300);
}
function closeMicSoon(ms=1200){ clearTimeout(micIdle); micIdle=setTimeout(()=>closeMic(false), ms); }
async function restartMic(){ closeMic(true); }  // kitą kartą atsidarys su naujais nustatymais
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='hidden' && !talking && !recBuf) closeMic(true); });
function encode(input){
  const ratio = ctx.sampleRate / RATE, out = [];
  while (dsPos < input.length){
    const a=Math.floor(dsPos), b=Math.max(a+1, Math.min(input.length, Math.floor(dsPos+ratio)));
    let sum=0; for(let i=a;i<b;i++) sum+=input[i];
    const v=Math.max(-1,Math.min(1,sum/(b-a)));
    out.push(linToMu(Math.round(v*32767)));
    dsPos += ratio;
  }
  dsPos -= input.length;
  return new Uint8Array(out);
}
function playChunk(bytes){
  if (!ctx) return;
  const buf=ctx.createBuffer(1,bytes.length,RATE), d=buf.getChannelData(0);
  for (let i=0;i<bytes.length;i++) d[i]=MU[bytes[i]]/32768;
  const s=ctx.createBufferSource(); s.buffer=buf; s.connect(gainOut);
  const now=ctx.currentTime;
  if (playHead < now+0.03) playHead = now+0.2;
  s.start(playHead); playHead += buf.duration;
}
function beep(freq, at=0, dur=0.07){
  if (!ctx) return;
  const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=freq;
  const t=Math.max(ctx.currentTime,at);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+0.02);
}

// ---------- ryšys ----------
let ws=null, cur=null /* {name,pw,owner,ticket} */, pending=null, rxFrom=null, talkerName=null, reconnectTimer=null;
let wantOpen=false, sendQueue=[], me={id:0,owner:false,admin:false}, lastUsers=[];
let adminKey = store.get('racija_admin','');
const joinMsg = c => c.viaAdmin
  ? {t:'adminJoin', name:myName, channel:c.name, token}
  : {t:'join', name:myName, channel:c.name, password:c.pw, token};
function ensureWs(){
  if (ws && (ws.readyState===0 || ws.readyState===1)) return;
  clearTimeout(reconnectTimer);
  const proto = location.protocol==='https:'?'wss':'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType='arraybuffer';
  ws.onopen = () => {
    $('dot').classList.add('on');
    if (adminKey) ws.send(JSON.stringify({t:'admin', key:adminKey}));
    if (cur && !pending) ws.send(JSON.stringify(joinMsg(cur)));
    sendQueue.splice(0).forEach(m=>ws.send(m));
  };
  ws.onclose = () => {
    $('dot').classList.remove('on');
    if (talking) stopTalk(true);
    if (wantOpen) reconnectTimer=setTimeout(ensureWs, 2000);
  };
  ws.onmessage = onMsg;
}
function wsSend(obj){
  const s=JSON.stringify(obj);
  if (ws && ws.readyState===1) ws.send(s); else { sendQueue.push(s); ensureWs(); }
}

function onMsg(ev){
  if (ev.data instanceof ArrayBuffer){ playChunk(new Uint8Array(ev.data)); return; }
  const m = JSON.parse(ev.data);
  switch(m.t){
    case 'joined': {
      if (!pending && !cur){ wsSend({t:'leave'}); return; } // vartotojas atšaukė
      const prev = findSaved(m.channel) || {};
      const src = pending || cur || {};
      const pw = src.pw ?? prev.pw ?? null;
      const viaAdmin = !!src.viaAdmin;
      cur = { name:m.channel, pw, viaAdmin, owner:m.owner, ticket:m.ticket, public:!!m.public };
      me.owner = m.owner; me.admin = m.admin;
      upsertSaved({ name:m.channel, pw, viaAdmin, owner:m.owner, last:Date.now() });
      if (pending){ closeModal(); }
      enterChannelUI(m.history);
      cur.timerCode = !!m.timerCode; setTimerState(m.timer, m.now);
      myLocId = m.locId; setLocs(m.locs||[]); setMeet(m.meet); resumeSharing();
      break;
    }
    case 'error':
      if (m.code==='badadmin' || m.code==='noadmin'){
        adminKey=''; store.del('racija_admin');
        if (!pending) { toast(m.msg); break; }
      }
      if (pending && pending.fromSaved && m.code==='notfound'){
        const c=pending.fromSaved; pending=null;
        openModal(`<h2>#${esc(c.name)} nerastas</h2>
          <p class="muted">Kanalas ištrintas arba dingo serveryje.${c.pw?' Gali jį sukurti iš naujo su tuo pačiu slaptažodžiu, tada seni kvietimai vėl veiks.':''}</p>
          ${c.pw?'<button class="btn" id="mRe">Sukurti iš naujo</button>':''}
          <button class="btn danger" id="mRm">Pašalinti iš sąrašo</button>
          <button class="btn alt" onclick="closeModal()">Uždaryti</button><div class="err" id="mErr"></div>`);
        if ($('mRe')) $('mRe').onclick=()=>{ $('mRe').disabled=true; pending={pw:c.pw}; wsSend({t:'create', name:myName, channel:c.name, password:c.pw, token}); };
        $('mRm').onclick=()=>{ saved=saved.filter(x=>x.name!==c.name); saveList(); closeModal(); renderList(); };
        break;
      }
      if (pending){ const e=$('mErr'); if(e) e.textContent=m.msg; const b=$('mOk'); if(b) b.disabled=false; }
      else if (m.code==='badpass' || m.code==='notfound'){
        // pvz. pakeistas slaptažodis ar ištrintas kanalas
        const n=cur&&cur.name; cur=null; show('scrList'); renderList();
        toast(m.code==='badpass' ? `#${n}: slaptažodis pasikeitė` : `#${n}: kanalas nebeegzistuoja`);
      } else toast(m.msg);
      break;
    case 'presence':
      talkerName=m.talker; me=m.me;
      if (cur && cur.owner!==m.me.owner){ cur.owner=m.me.owner; upsertSaved({name:cur.name, owner:cur.owner}); renderChSub(); }
      renderUsers(m.users); updateStatus(); break;
    case 'toast': toast(m.msg); break;
    case 'adminOk':
      if (pending && pending.adminAuth){ adminKey=pending.key; store.set('racija_admin',adminKey); pending=null; wsSend({t:'adminList'}); }
      break;
    case 'adminList': renderAdmin(m.channels); break;
    case 'adminDone':
      toast(m.msg);
      if (m.action==='adminDelete'){ saved=saved.filter(c=>c.name!==m.channel); saveList(); renderList(); }
      if (m.action==='adminPassword' && pending && pending.pwFor===m.channel){ const s=findSaved(m.channel); if(s){ s.pw=pending.pw; saveList(); } }
      pending=null; renderAdmin(m.channels); break;
    case 'granted':
      if (cmdAudio){ sendStoredAudio(cmdAudio); cmdAudio=null; break; }
      if ($('ptt').classList.contains('down')){ talking=true; dsPos=0; beep(880); vib(30); updateStatus(); } else wsSend({t:'stop'}); break;
    case 'busy':
      vib([60,40,60]); flash(`Užimta: kalba ${m.by}`); $('ptt').classList.remove('down');
      if (cmdAudio){ cmdAudio=null; } break;
    case 'start':
      rxFrom=m.from; beep(660); vib(20);
      if (m.cmd && !recentCmd(m.from, m.cmd)) showCmd(m.from, m.cmd, true);
      updateStatus(); break;
    case 'cmd':
      if (m.item) addHist(m.item);
      cmdSeen = {from:m.from, text:m.text, at:Date.now()};
      if (Date.now()-lastSentCmd < 3000 && m.from===myName){ toast(`${m.alarm?'🚨':'📢'} Išsiųsta: ${m.text}`); break; }
      if (!seenCid(m.cid)) break;               // jau gauta per LoRa
      if (m.alarm) showAlarm(m.from, m.text, m.cid); else showCmd(m.from, m.text, m.voice);
      break;
    case 'stop':
      if (rxFrom===m.from){ beep(440, playHead); rxFrom=null; }
      if (m.forced && talking){ stopTalk(true); if (m.forced!=='alarm') flash('Pasiektas 60 s limitas'); }
      if (m.item) addHist(m.item);
      updateStatus(); break;
    case 'cleared': $('hist').innerHTML=''; renderHistEmpty(); toast('Istorija išvalyta'); break;
    case 'deleted': {
      saved = saved.filter(c=>c.name!==m.channel); saveList();
      cur=null; show('scrList'); renderList(); toast(`Kanalas #${m.channel} ištrintas`); break;
    }
    case 'publicList': {
      const box=$('pubList'); if (!box) break;
      const mine=new Set(saved.map(c=>c.name));
      box.innerHTML = m.channels.length ? m.channels.map(c=>`<button class="menuItem pubCh" data-n="${esc(c.name)}">${mine.has(c.name)?'✅':'🔒'}<span>#${esc(c.name)}<small>${c.online?`● ${c.online} prisijungę`:'niekas neprisijungęs'}${mine.has(c.name)?' · jau tavo sąraše':''}</small></span></button>`).join('')
        : 'Bendrame sąraše grupių nėra. Įvesk pavadinimą ir slaptažodį arba įklijuok kvietimą.';
      box.classList.toggle('muted', !m.channels.length);
      box.querySelectorAll('.pubCh').forEach(b=>b.onclick=()=>{ $('mName').value=b.dataset.n; const s=findSaved(b.dataset.n); $('mPw').value=s&&s.pw||''; $('mPw').focus(); });
      break;
    }
    case 'timer':
      setTimerState(m.timer, m.now);
      if (m.item) addHist(m.item);
      if (pending && pending.timer){ closeModal(); }
      if (m.item && m.item.from!==myName){
        if (m.item.timer==='stop') showBanner('⏹ '+m.item.cmd+': sustabdytas', m.item.from);
        else showBanner('⏰ '+m.item.cmd+' · iki '+hhmm(m.item.end), m.item.from+(m.item.timer==='extend'?' pratęsė':' nustatė'));
      }
      break;
    case 'timerCode': if (cur){ cur.timerCode=m.on; if ($('tmMark')) timerModal(); } break;
    case 'locs': setLocs(m.list, m.now); break;
    case 'meet':
      setMeet(m.meet); if (m.item) addHist(m.item);
      if (pending && pending.meet) closeModal();
      if (m.item && m.item.from!==myName) showBanner(m.meet ? '🚩 '+m.meet.title : '🚩 Susitikimo vieta pašalinta', m.item.from + (m.meet ? ' pažymėjo žemėlapyje' : ''));
      break;
    case 'publicSet': if (cur){ cur.public=m.on; toast(m.on?'Grupė rodoma bendrame sąraše':'Grupė paslėpta iš bendro sąrašo'); } break;
    case 'passwordChanged': {
      if (pending && cur){ cur.pw=pending.pw; upsertSaved({name:cur.name, pw:cur.pw}); closeModal(); toast('Slaptažodis pakeistas. Pakviesk narius iš naujo.'); }
      break;
    }
  }
}

// ---------- vardo ekranas ----------
$('nameBtn').onclick = () => {
  const n=$('nameIn').value.trim();
  if (!n){ $('nameErr').textContent='Įvesk vardą'; return; }
  myName=n; store.set('racija_name',n);
  afterName();
};
$('nameIn').addEventListener('keydown', e=>{ if(e.key==='Enter') $('nameBtn').click(); });

function afterName(){
  $('hello').textContent = `Labas, ${myName}`;
  if (inviteData){ const d=inviteData; inviteData=null; showList(); inviteModal(d); }
  else showList();
}

// ---------- kanalų sąrašas ----------
function showList(){ show('scrList'); renderList(); if (window.renderMeshBox) renderMeshBox(); }
function renderList(){
  $('hello').textContent = `Labas, ${myName}`;
  const ul=$('chList');
  if (!saved.length){
    ul.innerHTML = `<div class="emptyBox"><b>Dar nėra kanalų</b>Spausk <b style="display:inline;color:var(--accent)">Prisijungti</b>: ten matysi bendrą grupių sąrašą arba galėsi įklijuoti draugo kvietimą. Arba sukurk savo grupę.</div>`;
    return;
  }
  ul.innerHTML = saved.map(c=>`
    <li data-n="${esc(c.name)}">
      <div class="av">${esc(c.name[0].toUpperCase())}</div>
      <div class="nm">#${esc(c.name)}<small>${c.viaAdmin?'🛡️ Administratorius':c.owner?'👑 Tu esi kūrėjas':'🔒 Narys'}</small></div>
      <button class="x" data-rm="${esc(c.name)}" aria-label="Pašalinti">✕</button>
    </li>`).join('');
}
$('chList').addEventListener('click', async e=>{
  const rm=e.target.closest('[data-rm]');
  if (rm){ forgetModal(rm.dataset.rm); return; }
  const li=e.target.closest('li[data-n]'); if(!li) return;
  const c=findSaved(li.dataset.n); if(!c) return;
  if (c.viaAdmin && !adminKey){ toast('Reikia administratoriaus rakto'); adminLogin(); return; }
  if (!(await audioOk())) return;
  openModal(`<h2>Jungiamasi prie #${esc(c.name)}…</h2><div class="err" id="mErr"></div><button class="btn alt" onclick="closeModal()">Atšaukti</button>`);
  pending={pw:c.pw, viaAdmin:c.viaAdmin, fromSaved:c}; wantOpen=true;
  wsSend(joinMsg(c));
});

// ---------- administratorius ----------
$('adminBtn').onclick = () => adminKey ? openAdmin() : adminLogin();
function adminLogin(){
  openModal(`<h2>🛡️ Administratorius</h2>
    <div class="field"><label>Administratoriaus raktas (ADMIN_KEY)</label><input id="mKey" type="password" autocomplete="off"></div>
    <button class="btn" id="mOk">Prisijungti</button><button class="btn alt" onclick="closeModal()">Atšaukti</button>
    <div class="err" id="mErr"></div>`);
  $('mOk').onclick = () => {
    const k=$('mKey').value; if(!k) return;
    $('mOk').disabled=true; pending={adminAuth:true, key:k}; wantOpen=true;
    wsSend({t:'admin', key:k});
  };
}
function openAdmin(){
  openModal(`<h2>🛡️ Visi kanalai</h2><div class="muted">Kraunama…</div>`);
  wantOpen=true; wsSend({t:'admin', key:adminKey}); wsSend({t:'adminList'});
}
let adminChannels=[];
function renderAdmin(list){
  adminChannels=list;
  if ($('modal').classList.contains('hidden') && !pending) openModal('');
  const fmt = ts => new Date(ts).toLocaleDateString('lt-LT');
  $('modalBox').innerHTML = `<h2>🛡️ Visi kanalai (${list.length})</h2>
    ${list.length ? list.map(c=>`
      <div class="adRow" data-n="${esc(c.name)}">
        <div class="adTop"><b>#${esc(c.name)}</b>${c.online?`<span class="on">● ${c.online}</span>`:''}</div>
        <div class="muted adMeta">Sukurtas ${fmt(c.created)} · ${c.msgs} įr. · ${c.owners} kūr.</div>
        <div class="adBtns">
          <button class="btn" data-a="enter">Įeiti</button>
          <button class="btn alt" data-a="pw">🔑</button>
          <button class="btn alt" data-a="own" title="Nuimti kūrėjus">👑✕</button>
          <button class="btn danger" data-a="del">🗑️</button>
        </div>
      </div>`).join('') : '<p class="muted">Kanalų dar nėra.</p>'}
    <button class="btn alt" id="mRefresh">Atnaujinti</button>
    <button class="btn danger" id="mAdminOut">Išeiti iš administratoriaus režimo</button>
    <button class="btn alt" onclick="closeModal()">Uždaryti</button>`;
  $('mRefresh').onclick = () => wsSend({t:'adminList'});
  $('mAdminOut').onclick = () => {
    adminKey=''; store.del('racija_admin');
    saved=saved.filter(c=>!c.viaAdmin || c.pw); saved.forEach(c=>c.viaAdmin=false); saveList();
    closeModal(); renderList(); if (ws) ws.close(); toast('Administratoriaus režimas išjungtas');
  };
  $('modalBox').querySelectorAll('.adRow').forEach(row=>{
    const n=row.dataset.n;
    row.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
      const a=b.dataset.a;
      if (a==='enter'){
        if (!(await audioOk())) return;
        pending={viaAdmin:true}; wsSend({t:'adminJoin', name:myName, channel:n, token});
      } else if (a==='pw'){
        openModal(`<h2>#${esc(n)}: naujas slaptažodis</h2>
          <div class="field"><label>Bent 6 simboliai</label><input id="mPw" maxlength="64"></div>

function parseInvite(text){
  const m = String(text||'').match(/https?:\/\/\S+/); if (!m) return null;
  try{ const u=new URL(m[0]); const c=u.searchParams.get('c'); return c ? {c, k:u.searchParams.get('k')||''} : null; }catch{ return null; }
}

const ptt=$('ptt');
function pttDown(e){

  if (ptt.classList.contains('down')) return;
  if (talkerName && talkerName!==myName){ vib([60,40,60]); flash(`Užimta: kalba ${talkerName}`); return; }

  if (currentAudio) currentAudio.pause();
  openMic().catch(()=>{ flash('Nepavyko įjungti mikrofono'); pttUp(); });
  wsSend({t:'start'});
}
function pttUp(e){
  if (e) e.preventDefault();
  if (!ptt.classList.contains('down')) return;
  ptt.classList.remove('down');
  if (talking) stopTalk(); else closeMicSoon();
}

  setTimeout(()=>{ talking=false; wsSend({t:'stop'}); if(!silent) beep(520); updateStatus(); closeMicSoon(); },120);

function addHist(i){
  const none=$('hist').querySelector('.none'); if(none) none.remove();

    li.style.cursor='pointer'; li.onclick=()=>openMap();
  } else if (i.timer){
    li.className='cmd';
    const what = i.timer==='stop' ? 'sustabdė laikmatį' : (i.timer==='extend'?'pratęsė iki ':'nustatė iki ')+hhmm(i.end);
    li.innerHTML=`<span class="who">⏰ ${esc(i.cmd)} <small style="color:var(--muted);font-weight:500">· ${esc(i.from)} ${what}</small></span><span class="t">${time}</span>`;
  } else if (i.cmd){

    li.innerHTML=`<span class="who">${i.alarm?'🚨':'📢'} ${esc(i.cmd)} <small style="color:var(--muted);font-weight:500">· ${esc(i.from)}</small></span><span class="t">${time}</span>`;
  } else {
    if (i.voiceCmd) li.className='cmd';
    li.innerHTML=`<span class="who">${i.voiceCmd?'🎙️ ':''}${esc(i.from)}</span><span class="t">${time} · ${i.dur}s</span><button aria-label="Groti">▶</button>`;
    li.querySelector('button').onclick=()=>playHist(i.id, li);
  }
  $('hist').prepend(li);
  while ($('hist').children.length>50) $('hist').lastChild.remove();
}
// laukiam naujo bilieto po persijungimo (iki 4 s)
function freshTicket(old){
  if (ws && ws.readyState===1 && cur) wsSend(joinMsg(cur)); else ensureWs();
  return new Promise(res=>{ const t0=Date.now(); const iv=setInterval(()=>{
    if (cur && cur.ticket && cur.ticket!==old){ clearInterval(iv); res(true); }
    else if (Date.now()-t0>4000){ clearInterval(iv); res(false); } }, 150); });
}
const AUDIO_ERR = {
  deleted: 'Įrašas ištrintas (senesnis nei 6 val. arba išvalyta istorija)',
  file: 'Įrašo failas nerastas serveryje',
  decrypt: 'Įrašo failas pažeistas',
  ticket: 'Ryšys atsinaujino – bandyk dar kartą'
};
async function playHist(id, li, retried){
  if (currentAudio){ currentAudio.pause(); document.querySelectorAll('#hist li.playing').forEach(x=>x.classList.remove('playing')); }
  if (!cur) return;
  li.classList.add('playing');
  const done = () => li.classList.remove('playing');
  let r;
  try{ r = await fetch(`/audio/${id}?k=${cur.ticket}`, {cache:'no-store'}); }
  catch{ done(); toast('Nėra ryšio su serveriu'); return; }
  if (r.status===404){
    const why = r.headers.get('X-Reason') || 'deleted';
    if (why==='ticket' && !retried){ const old=cur.ticket; if (await freshTicket(old)) return playHist(id, li, true); }
    done(); toast(AUDIO_ERR[why] || 'Įrašas nebeprieinamas'); return;
  }
  if (!r.ok){ done(); toast('Serverio klaida ('+r.status+')'); return; }
  const url = URL.createObjectURL(await r.blob());
  currentAudio = new Audio(url);
  currentAudio.onended = currentAudio.onpause = () => { done(); URL.revokeObjectURL(url); };
  currentAudio.play().catch(e=>{ done(); toast('Nepavyko paleisti garso: '+(e && e.name || '')); });
}

const shareKey = () => 'vc_share_' + (cur ? cur.name : '');
function shareState(){ try{ const s=JSON.parse(store.get(shareKey(),'null')); if (s && s.until && Date.now()>s.until){ store.del(shareKey()); return null; } return s; }catch{ return null; } }
function distM(a,b){ const R=6371000, r=Math.PI/180, dLa=(b.lat-a.lat)*r, dLo=(b.lon-a.lon)*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
const fmtDist = m => m<1000 ? Math.round(m)+' m' : (m/1000).toFixed(m<10000?1:0).replace('.',',')+' km';
function fmtAgo(ts){ const s=Math.max(0,Math.round((sNow()-ts)/1000)); return s<10?'ką tik':s<60?`prieš ${s} s`:`prieš ${Math.round(s/60)} min.`; }

// ----- siuntimas -----
function sendLoc(force){
  const st=shareState();
  if (!st) return;
  if (!myPos || !cur || !ws || ws.readyState!==1) return;
  const moved = lastLocSent ? distM(lastLocSent, myPos) : 1e9;
  if (!force && lastLocSent && moved < 15 && Date.now()-lastLocSent.at < 60000) return;  // nejudant – kas minutę
  if (!force && lastLocSent && Date.now()-lastLocSent.at < 10000) return;                 // ne dažniau nei kas 10 s
  wsSend({t:'loc', lat:myPos.lat, lon:myPos.lon, acc:myPos.acc, until: st.until ? st.until + srvOff : 0});
  lastLocSent = {...myPos, at:Date.now()};
}
function startGeo(){
  if (geoWatch!==null) return;
  if (!('geolocation' in navigator)){ toast('Šis telefonas neleidžia nustatyti vietos'); return; }
  geoWatch = navigator.geolocation.watchPosition(p=>{
    myPos = {lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy};
    sendLoc(false); renderMeetCard(); if (map && !$('mapView').classList.contains('hidden')) renderMap();
  }, e=>{
    if (e.code===1){ // leidimas atmestas
      store.del(shareKey()); stopGeo(); renderMapBtn();
      toast(NATIVE && !Native311.locationOk ? 'Atnaujink programėlę (mėlyna juosta viršuje), kad galėtum rodyti vietą' : 'Leisk programėlei naudoti vietą');
    }
  }, {enableHighAccuracy:true, maximumAge:10000, timeout:30000});
  stopGeo.iv = setInterval(()=>{ if (sharingWas && !shareState()) stopSharing(true); else sendLoc(false); }, 15000);
}
function stopGeo(){ if (geoWatch!==null){ navigator.geolocation.clearWatch(geoWatch); geoWatch=null; } clearInterval(stopGeo.iv); lastLocSent=null; }
let sharingWas=false;
// vieta sekama, jei ją rodai kitiems arba yra susitikimo vieta (tada tik atstumui skaičiuoti – niekam nesiunčiama)
function ensureGeo(){ if (shareState() || (meet && geoGranted) || !$('mapView').classList.contains('hidden')) startGeo(); else stopGeo(); }
let geoGranted=false;
try{ navigator.permissions && navigator.permissions.query({name:'geolocation'}).then(p=>{ geoGranted = p.state==='granted'; p.onchange=()=>{ geoGranted=p.state==='granted'; }; }).catch(()=>{}); }catch{}
function startSharing(hours){
  const until = hours ? Date.now()+hours*3600000 : 0;
  store.set(shareKey(), JSON.stringify({until})); sharingWas=true;
  if (NATIVE && Native311.requestLocation) try{ Native311.requestLocation(); }catch{}
  startGeo(); renderMapBtn();
  if (myPos) sendLoc(true);
  toast('📍 Tavo vieta rodoma kanalo nariams' + (until ? ' iki '+hhmm(until) : ''));
}
function stopSharing(expired){
  const had = !!store.get(shareKey(),null);
  store.del(shareKey()); sharingWas=false; wsSend({t:'locStop'}); renderMapBtn(); ensureGeo();
  if (had) toast(expired ? '📍 Vietos rodymo laikas baigėsi' : '📍 Vietos rodymas išjungtas');
}
function resumeSharing(){ if (shareState()){ sharingWas=true; startGeo(); setTimeout(()=>sendLoc(true), 1500); } else ensureGeo(); renderMapBtn(); }
function pauseSharing(){ if (shareState()) wsSend({t:'locStop'}); stopGeo(); }

function loadLeaflet(){
  if (window.L) return Promise.resolve();
  return loadLeaflet.p = loadLeaflet.p || new Promise((res, rej)=>{
    const css=document.createElement('link'); css.rel='stylesheet'; css.href='/leaflet/leaflet.css'; document.head.appendChild(css);
    const sc=document.createElement('script'); sc.src='/leaflet/leaflet.js'; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc);
  });
}
async function openMap(){
  if (!cur) return;
  try{ await loadLeaflet(); }catch{ toast('Nepavyko įkelti žemėlapio'); return; }
  $('mapView').classList.remove('hidden');
  $('mapTitle').textContent = '🗺️ #' + cur.name;
  if (!map){
    map = L.map('map', {zoomControl:true, attributionControl:true}).setView([55.3, 23.9], 7);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap', referrerPolicy:'strict-origin-when-cross-origin'}).addTo(map);
    map.on('click', onMapClick);
  }

  setTimeout(()=>{ map.invalidateSize(); renderMap(); }, 60);

  clearInterval(openMap.iv); openMap.iv=setInterval(renderMapList, 5000);
  ensureGeo();
}

// ----- susitikimo vieta -----
let meet=null, meetLayer=null, meetLine=null, placing=false;
const DIRS=['Š','ŠR','R','PR','P','PV','V','ŠV'];
function bearing(a,b){ const r=Math.PI/180, y=Math.sin((b.lon-a.lon)*r)*Math.cos(b.lat*r),
  x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lon-a.lon)*r);
  return (Math.atan2(y,x)/r+360)%360; }
function dirText(a,b){ const d=bearing(a,b); return ['↑','↗','→','↘','↓','↙','←','↖'][Math.round(d/45)%8] + ' ' + DIRS[Math.round(d/45)%8]; }
function setMeet(m){ meet = m || null; renderMeetCard(); ensureGeo(); if (map && !$('mapView').classList.contains('hidden')) renderMap(); }
function renderMeetCard(){
  const c=$('meetCard');
  if (!meet || !cur){ c.classList.add('hidden'); return; }
  c.classList.remove('hidden');
  $('mtTitle').textContent = meet.title;
  if (myPos){
    const d=distM(myPos,meet);
    $('mtInfo').textContent = (d<25 ? 'Tu jau čia' : fmtDist(d) + ' · ' + DIRS[Math.round(bearing(myPos,meet)/45)%8]) + ' · pažymėjo ' + meet.by;
    $('mtArrow').style.transform = `rotate(${bearing(myPos,meet)}deg)`; $('mtArrow').style.opacity = 1;
  } else {
    $('mtInfo').textContent = 'Paspausk, kad matytum atstumą · pažymėjo ' + meet.by;
    $('mtArrow').style.opacity = .3;
  }
}
$('meetCard').onclick = () => openMap();
function renderMeetOnMap(){
  if (!map) return;
  if (!meet){ if (meetLayer){ map.removeLayer(meetLayer); meetLayer=null; } if (meetLine){ map.removeLayer(meetLine); meetLine=null; } return; }
  const ll=[meet.lat, meet.lon];
  if (!meetLayer){
    meetLayer = L.marker(ll, {icon: L.divIcon({className:'flagIcon', html:'🚩', iconSize:[30,30], iconAnchor:[6,28]}), zIndexOffset:1000})
      .bindTooltip('', {permanent:true, direction:'right', offset:[14,-14], className:'flagLbl'}).addTo(map);
  }
  meetLayer.setLatLng(ll); meetLayer.setTooltipContent(esc(meet.title));
  // tiesi linija nuo manęs iki susitikimo vietos su atstumu viduryje
  if (myPos){
    const pts=[[myPos.lat,myPos.lon], ll], mid=[(myPos.lat+meet.lat)/2, (myPos.lon+meet.lon)/2];
    const txt = fmtDist(distM(myPos,meet)) + ' ' + dirText(myPos,meet);
    if (!meetLine){
      meetLine = L.polyline(pts, {color:'#3fa9f5', weight:4, dashArray:'10 8', opacity:.95}).addTo(map);
      meetLine.bindTooltip('', {permanent:true, direction:'center', className:'distLbl'});
    }
    meetLine.setLatLngs(pts); meetLine.setTooltipContent(esc(txt)); meetLine.openTooltip(mid);
  } else if (meetLine){ map.removeLayer(meetLine); meetLine=null; }
}
function meetModal(){

function personColor(l){ return l.id===myLocId ? '#3fa9f5' : (sNow()-l.ts > 120000 ? '#7d8a99' : '#ff8a1f'); }
function renderMap(){
  if (!map) return;
  const seen=new Set();
  const pts = locs.map(l=>({...l}));
  // mano vieta, net jei nerodau kitiems (matau tik aš)
  if (myPos && !pts.some(p=>p.id===myLocId)) pts.push({id:'__me', name:myName+' (tu)', lat:myPos.lat, lon:myPos.lon, acc:myPos.acc, ts:Date.now(), local:true});
  for (const p of pts){
    seen.add(p.id);
    const col = p.local ? '#3fa9f5' : personColor(p);
    const isMe = p.local || p.id===myLocId;
    const label = isMe ? myName+' (tu)' : p.name + (myPos ? ' · ' + fmtDist(distM(myPos,p)) : '');
    let mk = mapMarkers.get(p.id);
    if (!mk){
      mk = L.circleMarker([p.lat,p.lon], {radius:9, weight:3, color:'#fff', fillColor:col, fillOpacity:1})
        .bindTooltip(esc(label), {permanent:true, direction:'top', offset:[0,-10], className:'mapLbl'}).addTo(map);
      mapMarkers.set(p.id, mk);
    } else { mk.setLatLng([p.lat,p.lon]); mk.setStyle({fillColor:col}); mk.setTooltipContent(esc(label)); }
  }
  for (const [id, mk] of mapMarkers) if (!seen.has(id)){ map.removeLayer(mk); mapMarkers.delete(id); }
  renderMeetOnMap();
  const all = pts.map(p=>[p.lat,p.lon]); if (meet) all.push([meet.lat, meet.lon]);
  if (!mapFitted && all.length){
    mapFitted = true;
    if (all.length===1) map.setView(all[0], 16);
    else map.fitBounds(L.latLngBounds(all), {padding:[50,50], maxZoom:17});
  }
  renderMapList();
}
function renderMapList(){
  const st=shareState();
  $('mapSub').textContent = (locs.length ? `Vietą rodo: ${locs.length}` : 'Niekas nerodo vietos') + (st ? ' · tu rodai' : '');
  const rows = locs.filter(l=>l.id!==myLocId).sort((a,b)=> myPos ? distM(myPos,a)-distM(myPos,b) : a.name.localeCompare(b.name));
  const meetRow = meet ? `<button class="pRow meet" data-meet="1"><span style="font-size:18px">🚩</span><span class="pn">${esc(meet.title)}</span>

let timer=null, srvOff=0, tFired={};
const hhmm = ts => new Date(ts).toLocaleTimeString('lt-LT',{hour:'2-digit',minute:'2-digit'});
const sNow = () => Date.now() + srvOff;
function fmtLeft(ms){
  const t=Math.max(0,Math.ceil(ms/1000)), h=Math.floor(t/3600), m=Math.floor(t%3600/60), sec=t%60;
  return (h? h+':'+String(m).padStart(2,'0') : String(m)) + ':' + String(sec).padStart(2,'0');
}
function setTimerState(t, now){
  if (now) srvOff = now - Date.now();
  const same = timer && t && timer.end===t.end;
  timer = t || null;
  if (!same){ const left = timer ? timer.end - sNow() : 0; tFired = {w10: left<=600000, w1: left<=60000, end: left<=0}; }
  tickTimer();
}
function tickTimer(){
  const card=$('timerCard');
  if (!timer){ card.classList.add('hidden'); return; }
  card.classList.remove('hidden');
  const now=sNow(), left=timer.end-now, total=Math.max(1,timer.end-timer.start);
  $('tTitle').textContent = '⏰ ' + timer.title;
  $('tEnd').textContent = 'iki ' + hhmm(timer.end);
  $('tFill').style.width = Math.min(100, Math.max(0,(now-timer.start)/total*100)) + '%';
  card.className = left<=0 ? 'done' : left<=60000 ? 'crit' : left<=600000 ? 'warn' : '';
  const ago = Math.floor(-left/60000);
  $('tLeft').textContent = left>0 ? fmtLeft(left) : (ago<1 ? 'Laikas baigėsi!' : 'Baigėsi prieš ' + ago + ' min.');
  // įspėjimai: kiekvienas tik kartą
  if (left<=600000 && !tFired.w10){ tFired.w10=true; if (left>60000){ showBanner('⏰ Liko 10 min.', timer.title); beep(880); beep(880, ctx?ctx.currentTime+0.2:0); vib([120,80,120]); } }
  if (left<=60000 && !tFired.w1){ tFired.w1=true; if (left>0){ showBanner('⏰ Liko 1 min.', timer.title); beep(988); beep(988, ctx?ctx.currentTime+0.15:0); beep(988, ctx?ctx.currentTime+0.3:0); vib([150,80,150,80,150]); } }
  if (left<=0 && !tFired.end){ tFired.end=true; showBanner('⏰ Laikas! ' + timer.title, 'Laikas baigėsi '+hhmm(timer.end), 10000);
    if (ctx){ const t0=ctx.currentTime; for (let i=0;i<6;i++){ beep(i%2?1175:880, t0+i*0.25, 0.18); } }
    vib([400,150,400,150,800]); speak('Laikas. ' + timer.title); }
}

    if ($('tAt').value){
      const [hh,mm]=$('tAt').value.split(':').map(Number); const d=new Date(); d.setHours(hh,mm,0,0);

      return send({t:'timerSet', title, endAt:d.getTime()+srvOff});

    const min=(+$('tH').value||0)*60 + (+$('tM').value||0);

  };
  if ($('tSaveCode')) $('tSaveCode').onclick=()=>{ const c=$('tNewCode').value.trim(); if (c.length<4){ $('mErr').textContent='Kodas bent 4 simboliai'; return; } wsSend({t:'timerCode', code:c}); toast('Valdymo kodas išsaugotas'); };

const DEFAULT_CMDS = [
  {id:'stop',  text:'Stop visiems', alarm:true},

let cmdAudio=null, lastSentCmd=0, cmdSeen={};
const stopCmd = () => cmds.find(c=>c.alarm) || cmds[0];
const recentCmd = (from,text) => cmdSeen.from===from && cmdSeen.text===text && Date.now()-cmdSeen.at<4000;

const b64enc = u8 => { let s=''; for (let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); };
const b64dec = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));

function renderCmdChips(){
  $('cmdChips').innerHTML = cmds.filter(c=>!c.alarm).map(c=>
    `<button class="cmdChip" data-id="${esc(c.id)}">${c.audio?'🎙️ ':''}${esc(c.text)}</button>`).join('')

$('cmdChips').addEventListener('click', e=>{

// bendras komandos id: 4 simboliai = minutė (base36), 2 = atsitiktiniai. Pagal jį šalinami dublikatai ir senos žinutės.
function newCid(){
  const min = Math.floor(Date.now()/60000) % (36**4);
  return min.toString(36).padStart(4,'0') + Math.floor(Math.random()*1296).toString(36).padStart(2,'0');
}
const seenIds = new Map();
function seenCid(cid){            // true, jei naujas
  if (!cid) return true;
  if (seenIds.has(cid)) return false;
  seenIds.set(cid, Date.now());
  if (seenIds.size>300) seenIds.delete(seenIds.keys().next().value);
  // programėlė galėjo tą pačią žinutę jau gauti per LoRa (ir paleisti sireną)
  if (NATIVE) try{ if (Native311.markSeen(cid)===false) return false; }catch{}
  return true;
}
function sendCmd(c){
  const online = ws && ws.readyState===1 && cur && scrVisible('scrChan');
  const lora = meshReady();
  if (!online && !lora){ flash('Nėra ryšio'); return; }
  const cid = newCid(); seenCid(cid);
  lastSentCmd = Date.now();
  let via=[];
  if (online){ wsSend({t:'cmd', text:c.text, alarm:!!c.alarm, voice:!!c.audio, cid}); via.push('internetu'); }
  if (lora){
    const msg = `${c.alarm?'🚨':'📢'} ${c.text} · ${myName} #${cid}`;
    try{ if (Native311.meshSend(msg, cid)) via.push('LoRa'); }catch{}
  }
  vib(c.alarm ? [100,50,100] : 40);
  if (!online) toast(`${c.alarm?'🚨':'📢'} Išsiųsta ${via.join(' + ')}: ${c.text}`);
  if (online && c.audio && !talking){ cmdAudio=c; wsSend({t:'start', cmd:c.text}); }
}
function sendStoredAudio(c){
  const a=b64dec(c.audio);
  for (let i=0;i<a.length;i+=3200) ws.send(a.subarray(i,i+3200));
  wsSend({t:'stop'});
}

// ----- gavėjo pusė -----
let sirenNodes=[];
function siren(sec=3){
  if (!ctx) return;
  const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime;
  o.type='square'; g.gain.value=0.35;
  for (let i=0;i<sec*2;i++){ o.frequency.setValueAtTime(700,t+i*0.5); o.frequency.linearRampToValueAtTime(1500,t+i*0.5+0.45); }
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+sec);
  sirenNodes.push(o);
}
function stopSiren(){ sirenNodes.forEach(o=>{ try{o.stop()}catch{} }); sirenNodes=[]; }
function showAlarm(from, text, cid, nativeDone){
  $('alarmTxt').textContent = text;
  $('alarmFrom').textContent = '— ' + from;
  $('alarm').classList.remove('hidden');
  if (NATIVE){ if (!nativeDone) try{ Native311.alarmId(text, from, cid||''); }catch{ siren(3); } } else siren(3);
  vib([600,200,600,200,600,200,1200]);
}
$('alarmOk').onclick = () => {
  $('alarm').classList.add('hidden'); stopSiren(); vib(0);
  if (NATIVE) try{ Native311.alarmStop(); }catch{}
};
function showBanner(text, sub, ms=4500){
  $('cbTxt').textContent = text; $('cbFrom').textContent = sub||'';
  $('cmdBanner').classList.remove('hidden');
  clearTimeout(showCmd.t); showCmd.t=setTimeout(()=>$('cmdBanner').classList.add('hidden'), ms);
}
function showCmd(from, text, voice){
  $('cbTxt').textContent = '📢 ' + text;
  $('cbFrom').textContent = from;
  $('cmdBanner').classList.remove('hidden');
  clearTimeout(showCmd.t); showCmd.t=setTimeout(()=>$('cmdBanner').classList.add('hidden'), 4500);
  beep(988); beep(1319, ctx?ctx.currentTime+0.12:0);
  vib([80,60,80]);
  if (!voice) speak(text);
}
$('cmdBanner').onclick = () => $('cmdBanner').classList.add('hidden');
function speak(text){
  try{
    if (!('speechSynthesis' in window)) return;
    const u=new SpeechSynthesisUtterance(text);
    const v=speechSynthesis.getVoices().find(v=>/^lt/i.test(v.lang));
    if (v) u.voice=v; u.lang = v ? v.lang : 'lt-LT'; u.rate=1.05;
    speechSynthesis.speak(u);
  }catch{}
}

// ----- komandų redaktorius -----
function cmdEditor(){
  const rows = cmds.map((c,i)=>`
    <div class="cmdRow" data-i="${i}">
      <span style="font-size:20px">${c.alarm?'🚨':'📢'}</span>
      <input value="${esc(c.text)}" maxlength="40" data-f="text">
      <button class="rec" data-f="rec" title="Laikyk ir kalbėk">🎙️</button>
      <button class="${c.audio?'has':''}" data-f="play" ${c.audio?'':'disabled style="opacity:.35"'}>▶</button>
      ${c.alarm?'':'<button data-f="del">✕</button>'}
    </div>`).join('');
  openModal(`<h2>📢 Greitos komandos</h2>
    <p class="muted" style="margin-top:-8px">Laikyk 🎙️ ir pasakyk komandą savo balsu (iki 5 s). Be įrašo kiti matys užrašą ir išgirs signalą.</p>
    ${rows}
    <button class="btn alt" id="cmdAdd">＋ Pridėti komandą</button>
    <button class="btn alt" id="cmdReset">Atstatyti numatytas</button>
    <button class="btn" onclick="closeModal()">Baigti</button>`);
  const box=$('modalBox');
  box.querySelectorAll('.cmdRow').forEach(row=>{
    const c=cmds[+row.dataset.i];
    row.querySelector('[data-f=text]').onchange = e => { c.text = e.target.value.trim() || c.text; saveCmds(); renderCmdChips(); };
    const rec=row.querySelector('[data-f=rec]');
    let tm=null;
    const start = async e => {
      e.preventDefault();
      dsPos=0; recBuf=[]; rec.classList.add('on'); vib(30);
      tm=setTimeout(stop, 5000);
      try{ await openMic(); }catch{ recBuf=null; rec.classList.remove('on'); toast('Nepavyko įjungti mikrofono'); }
    };
    const stop = () => {
      if (!recBuf) return;
      clearTimeout(tm); rec.classList.remove('on');
      setTimeout(()=>{ // paskutinis garso blokas
        const parts=recBuf; recBuf=null; closeMicSoon();
        const len=parts.reduce((a,p)=>a+p.length,0);
        if (len < RATE*0.4){ toast('Per trumpa – laikyk mygtuką kalbėdamas'); return; }
        const all=new Uint8Array(len); let o=0; parts.forEach(p=>{ all.set(p,o); o+=p.length; });
        c.audio=b64enc(all); saveCmds(); renderCmdChips(); toast('Įrašyta: '+c.text); cmdEditor();
      }, 250);
    };
    rec.addEventListener('pointerdown', start);
    rec.addEventListener('pointerup', stop); rec.addEventListener('pointercancel', stop); rec.addEventListener('pointerleave', stop);
    rec.addEventListener('contextmenu', e=>e.preventDefault());
    row.querySelector('[data-f=play]').onclick = async () => { if (!c.audio || !(await audioOk())) return; const a=b64dec(c.audio); for (let i=0;i<a.length;i+=3200) playChunk(a.subarray(i,i+3200)); };
    const del=row.querySelector('[data-f=del]');
    if (del) del.onclick = () => { cmds.splice(+row.dataset.i,1); saveCmds(); renderCmdChips(); cmdEditor(); };
  });
  $('cmdAdd').onclick = () => { cmds.push({id:'c'+Date.now(), text:'Nauja komanda'}); saveCmds(); renderCmdChips(); cmdEditor(); };
  $('cmdReset').onclick = () => { cmds=DEFAULT_CMDS.map(c=>({...c})); saveCmds(); renderCmdChips(); cmdEditor(); };
}
renderCmdChips();

// ---------- LoRa (Meshtastic) ----------
let meshState = {state:'off'};
const meshReady = () => NATIVE && meshState.state==='connected';
const MESH_LABEL = {off:'Neprijungta', no_perm:'Reikia Bluetooth leidimo', bt_off:'Bluetooth išjungtas', connecting:'Jungiamasi…',
  connected:'Prijungta', not_meshtastic:'Tai ne Meshtastic įrenginys', disconnected:'Ryšys nutrūko, jungiamasi iš naujo…', no_service:'Paleidžiama…'};
function meshRefresh(){
  if (!NATIVE) return;
  try{ meshState = JSON.parse(Native311.meshInfo()); }catch{}
  renderMeshBox(); renderMeshDot();
  if ($('meshModalMark')) renderMeshModal();
}
window.nativeMeshStatus = () => meshRefresh();
window.nativeMesh = (raw, alarmHandled) => {
  const m = raw.trim().match(/^(🚨|📢)\s*(.+?)\s+·\s+(.+?)\s+#([0-9a-z]{6})$/u);
  let alarm, text, from='LoRa', cid=null;
  if (m){ alarm=m[1]==='🚨'; text=m[2]; from=m[3]; cid=m[4]; }
  else { alarm=raw.startsWith('🚨'); text=raw.replace(/^(🚨|📢)\s*/u,''); }
  if (cid){ if (seenIds.has(cid)) return; seenIds.set(cid, Date.now()); }
  if (alarm) showAlarm(from+' · LoRa', text, cid, alarmHandled); else showCmd(from+' · LoRa', text, false);
  if (scrVisible('scrChan')) addHist({id:0, from:from+' · LoRa', ts:Date.now(), dur:0, cmd:text, alarm});
};
function renderMeshDot(){
  let d=$('meshDot');
  if (!d){ d=document.createElement('span'); d.id='meshDot'; d.textContent='📡'; d.title='LoRa'; $('dot').after(d); }
  d.className = meshReady() ? 'on' : (meshState.state==='off' ? 'off' : 'warn');
  d.classList.toggle('hidden', !NATIVE || meshState.state==='off');
}
window.renderMeshBox = function(){
  const box=$('meshBox');
  if (!NATIVE){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const ok=meshReady();
  if ($('cmdBar').parentNode===box) $('scrChan').insertBefore($('cmdBar'), $('pttWrap')); // kad innerHTML jo nesunaikintų
  box.innerHTML = `<div class="meshCard ${ok?'ok':''}">
      <span class="mi">📡</span>
      <span class="mt"><b>LoRa: ${esc(MESH_LABEL[meshState.state]||meshState.state)}</b>
        <small>${ok ? esc(meshState.name||'') + ' · STOP ir komandos veikia be interneto' : 'STOP signalai per Meshtastic, kai nėra interneto'}</small></span>
      <button class="ghost" id="meshSet">${meshState.state==='off'?'Prijungti':'Nustatyti'}</button>
    </div>`;
  $('meshSet').onclick = meshModal;
  if (ok && scrVisible('scrList')) box.appendChild($('cmdBar'));
};
function meshModal(){ openModal('<div id="meshModalMark"></div>'); renderMeshModal(); }
function renderMeshModal(){
  let devs=null; try{ devs=JSON.parse(Native311.meshDevices()); }catch{}
  const st=meshState, ok=meshReady();
  const list = devs===null
    ? `<p class="muted">Reikia leidimo naudoti Bluetooth.</p><button class="btn" id="mPerm">Leisti Bluetooth</button>`
    : devs.length===0
      ? `<p class="muted">Nėra suporuotų įrenginių. Suporuok Meshtastic mazgą telefono Bluetooth nustatymuose. PIN kodas rodomas mazgo ekrane arba numatytas <b>123456</b>.</p>`
      : devs.sort((a,b)=>b.mesh-a.mesh).map(d=>`<button class="menuItem meshDev" data-a="${esc(d.address)}">${d.address===st.address?'✅':(d.mesh?'📡':'🔵')}<span>${esc(d.name)}<small>${esc(d.address)}${d.mesh?' · Meshtastic':''}</small></span></button>`).join('');
  $('modalBox').innerHTML = `<div id="meshModalMark"></div><h2>📡 LoRa (Meshtastic)</h2>
    <div class="meshCard ${ok?'ok':''}" style="margin-bottom:14px"><span class="mi">📡</span><span class="mt"><b>${esc(MESH_LABEL[st.state]||st.state)}</b><small>${esc(st.name||'Įrenginys nepasirinktas')}</small></span></div>
    <div class="sec"><span>Pasirink mazgą</span></div>
    ${list}
    <button class="btn alt" id="mBt">Atidaryti Bluetooth nustatymus</button>
    <div class="field" style="margin-top:14px"><label>Meshtastic kanalo numeris (0 = pagrindinis)</label>
      <select id="mCh">${[0,1,2,3,4,5,6,7].map(i=>`<option ${i===st.channel?'selected':''}>${i}</option>`).join('')}</select></div>
    ${ok?`<button class="btn" id="mTest">Siųsti bandomąją žinutę</button>`:''}
    ${st.state!=='off'?`<button class="btn danger" id="mOff">Atjungti mazgą</button>`:''}
    <p class="muted" style="font-size:13px">Prie mazgo vienu metu gali būti prijungta tik viena programėlė, todėl oficiali Meshtastic programėlė turi būti atjungta. Visi instruktoriai turi naudoti tą patį Meshtastic kanalą ir raktą.</p>
    <button class="btn alt" onclick="closeModal()">Uždaryti</button>`;
  if ($('mPerm')) $('mPerm').onclick = () => Native311.meshRequestPerm();
  $('mBt').onclick = () => Native311.openBtSettings();
  $('mCh').onchange = e => Native311.meshSetChannel(+e.target.value);
  $('modalBox').querySelectorAll('.meshDev').forEach(b=>b.onclick=()=>{ Native311.meshConnect(b.dataset.a); toast('Jungiamasi…'); });
  if ($('mTest')) $('mTest').onclick = () => { const cid=newCid(); seenCid(cid); const ok=Native311.meshSend(`📢 Bandymas · ${myName} #${cid}`, cid); toast(ok?'Bandomoji žinutė išsiųsta per LoRa':'Nepavyko išsiųsti'); };
  if ($('mOff')) $('mOff').onclick = () => Native311.meshDisconnect();
}

// ---------- automatinis sąsajos atnaujinimas ----------
const WEBVER = '__WEBVER__';
let reloadWanted = false;
const idle = () => !talking && !recBuf && !ptt.classList.contains('down') && !modalOpen() && $('mapView').classList.contains('hidden')
  && $('alarm').classList.contains('hidden') && !(talkerName && talkerName!==myName);
function doReload(){
  if (cur && scrVisible('scrChan')) store.set('vc_rejoin', JSON.stringify({name:cur.name, at:Date.now()}));
  location.reload();
}
async function checkWebVer(){
  if (WEBVER.startsWith('__')) return;
  try{
    const r = await (await fetch('/webver',{cache:'no-store'})).json();
    if (r.v && r.v !== WEBVER){ if (!reloadWanted) reloadWanted = Date.now(); if (idle()) doReload(); }
  }catch{}
}
setInterval(()=>{ if (!reloadWanted) return;
  if (idle() || (Date.now()-reloadWanted > 10*60*1000 && !talking && !recBuf)) doReload(); }, 3000);
setInterval(checkWebVer, 2*60*1000);
setTimeout(checkWebVer, 5000);
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') checkWebVer(); });
function autoRejoin(){
  let r=null; try{ r=JSON.parse(store.get('vc_rejoin','null')); }catch{}
  store.del('vc_rejoin');
  if (!r || Date.now()-r.at > 60000 || !myName) return;
  const c=findSaved(r.name); if (!c) return;
  const li=[...document.querySelectorAll('#chList li[data-n]')].find(x=>x.dataset.n===c.name);
  if (li) li.click();
}
