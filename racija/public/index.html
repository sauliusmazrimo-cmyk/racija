<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>311 VoiceCH</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-title" content="311 VoiceCH">
<script src="/qrcode.js"></script>
<style>
:root{
  --bg:#0b0f14; --panel:#121820; --panel2:#18202a; --line:#1f2833; --text:#e6edf3; --muted:#7d8a99;
  --accent:#ff8a1f; --accent2:#ffb347; --ok:#2ecc71; --busy:#e74c3c; --rx:#3fa9f5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.hidden{display:none!important}
button{font:inherit;cursor:pointer}
.scr{flex:1;display:flex;flex-direction:column;max-width:520px;width:100%;margin:0 auto;min-height:0}

label{font-size:13px;color:var(--muted);display:block;margin:0 0 6px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  color:var(--text);font-size:17px;outline:none}
input:focus{border-color:var(--accent)}
.field{margin-bottom:14px}
.btn{width:100%;padding:15px;border:0;border-radius:12px;background:var(--accent);color:#111;font-weight:700;font-size:16px}
.btn.alt{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--busy);border:1px solid rgba(231,76,60,.5)}
.btn + .btn{margin-top:10px}
.err{color:var(--busy);font-size:14px;min-height:20px;margin-top:8px}
.muted{color:var(--muted);font-size:14px}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font-size:14px}
.icon{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--text);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}

/* vardo ekranas */
#scrName{justify-content:center}
#scrName h1{margin:0 0 6px;font-size:36px}
#scrName h1 span,.brand span{color:var(--accent)}
#scrName p{margin:0 0 24px}

/* kanalų sąrašas */
.top{display:flex;align-items:center;gap:10px;padding:16px 0 12px}
.top .grow{flex:1;min-width:0}
.brand{font-weight:800;font-size:22px}
.hello{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chList{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
#chList li{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--panel);
  border:1px solid var(--line);margin-bottom:8px}
#chList li .nm{flex:1;min-width:0;font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis}
#chList li .nm small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
#chList li .av{width:40px;height:40px;border-radius:12px;background:rgba(255,138,31,.15);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
#chList li .x{background:none;border:0;color:var(--muted);font-size:18px;padding:6px}
.emptyBox{text-align:center;padding:40px 10px;color:var(--muted)}
.emptyBox b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 0 16px}
.actions .btn + .btn{margin-top:0}

/* kanalas */
.dot{width:10px;height:10px;border-radius:50%;background:var(--busy);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.chTitle{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#status{height:52px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:600;transition:.15s;padding:0 10px;text-align:center}
#status.rx{background:rgba(63,169,245,.15);border-color:var(--rx);color:var(--rx)}
#status.tx{background:rgba(255,138,31,.15);border-color:var(--accent);color:var(--accent)}
#status.busy{background:rgba(231,76,60,.15);border-color:var(--busy);color:var(--busy)}
#pttWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:220px}
#ptt{width:min(60vw,230px);height:min(60vw,230px);border-radius:50%;border:0;
  background:radial-gradient(circle at 35% 30%,var(--accent2),var(--accent) 60%,#c25d00);
  color:#1a1a1a;font-size:20px;font-weight:800;letter-spacing:1px;
  box-shadow:0 10px 40px rgba(255,138,31,.35),inset 0 -6px 0 rgba(0,0,0,.2);
  user-select:none;-webkit-user-select:none;touch-action:none;transition:transform .08s}
#ptt.down{transform:scale(.94);box-shadow:0 0 0 14px rgba(255,138,31,.18),0 0 60px rgba(255,138,31,.6)}
#ptt.locked{background:#2a3340;color:var(--muted);box-shadow:none}
#ptt small{display:block;font-size:12px;font-weight:600;opacity:.7;margin-top:6px}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:10px 0 8px;display:flex;justify-content:space-between}
#users{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.chip.talk{border-color:var(--rx);color:var(--rx)}
#hist{list-style:none;margin:0;padding:0 0 16px;overflow-y:auto;max-height:30vh}
#hist li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);margin-bottom:6px}
#hist li .who{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hist li .t{color:var(--muted);font-size:13px;white-space:nowrap}
#hist li button{width:40px;height:40px;border-radius:50%;border:0;background:var(--line);color:var(--text);font-size:15px;flex:none}
#hist li.playing button{background:var(--rx);color:#000}
#hist .none{background:none;border:0;color:var(--muted);font-size:14px;padding:4px 0}

/* modalas */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:10;
  padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
#modal .box{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;
  max-height:90vh;overflow-y:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#modal h2{margin:0 0 16px;font-size:20px}
.menuItem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:12px;
  background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:16px;margin-bottom:8px}
.menuItem.red{color:var(--busy)}
.menuItem small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.qr{background:#fff;border-radius:14px;padding:12px;width:220px;margin:0 auto 14px}
.qr svg{display:block;width:100%;height:auto}
.linkBox{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;
  word-break:break-all;color:var(--muted);margin-bottom:12px}
.cred{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin-bottom:14px}
.cred span{color:var(--muted)}
.chip.own::before{content:'👑 '}
.chip.tap{cursor:pointer}
.adRow{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.adTop{display:flex;justify-content:space-between;align-items:center;font-size:16px}
.adTop .on{color:var(--ok);font-size:13px;font-weight:600}
.adMeta{font-size:12px;margin:2px 0 10px}
.adBtns{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px}
.adBtns .btn{padding:10px 6px;font-size:14px;margin:0}
/* komandos */
#cmdBar{margin-top:10px}
#stopBtn{position:relative;overflow:hidden;width:100%;height:58px;border:0;border-radius:14px;background:#7a1d16;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;letter-spacing:.5px;
  user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:inset 0 0 0 2px rgba(255,90,70,.5)}
#stopBtn b,#stopBtn small{position:relative;z-index:1}
#stopBtn small{font-size:12px;opacity:.75}
#stopBtn .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#e74c3c}
#stopBtn.hold .fill{width:100%;transition:width 1s linear}
#cmdChips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
#cmdChips::-webkit-scrollbar{display:none}
.cmdChip{flex:none;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,138,31,.45);background:rgba(255,138,31,.12);
  color:var(--text);font-weight:700;font-size:15px;white-space:nowrap}
.cmdChip.edit{border-color:var(--line);background:var(--panel);color:var(--muted);font-weight:500}
.cmdChip:active{transform:scale(.96)}
#hist li.cmd .who{color:var(--accent2)}
#hist li.alarm{border-color:rgba(231,76,60,.6);background:rgba(231,76,60,.12)}
#hist li.alarm .who{color:#ff6b5b}
/* signalas */
#alarm{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:#b3160c;color:#fff;text-align:center;padding:24px;animation:flashA .5s steps(1) infinite}
@keyframes flashA{50%{background:#3a0603}}
#alarm .big{font-size:72px;font-weight:900;letter-spacing:2px}
#alarm .txt{font-size:28px;font-weight:800}
#alarm .from{font-size:18px;opacity:.85}
#alarm button{margin-top:30px;padding:18px 40px;border:0;border-radius:16px;background:#fff;color:#b3160c;font-size:20px;font-weight:900}
#cmdBanner{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));z-index:25;padding:16px 18px;border-radius:16px;
  background:#ff8a1f;color:#111;box-shadow:0 10px 40px rgba(0,0,0,.5);text-align:center;animation:up .18s ease-out}
#cmdBanner b{display:block;font-size:24px}
#cmdBanner small{font-size:14px;opacity:.8}
.cmdRow{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
.cmdRow input{flex:1;min-width:0;padding:10px;font-size:15px}
.cmdRow button{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:17px}
.cmdRow button.rec{background:#7a1d16;border-color:#e74c3c}
.cmdRow button.rec.on{background:#e74c3c;animation:flashA .6s steps(1) infinite}
.cmdRow button.has{border-color:var(--ok)}
.meshCard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:10px}
.meshCard.ok{border-color:rgba(46,204,113,.5);background:rgba(46,204,113,.08)}
.meshCard .mi{font-size:22px}
.meshCard .mt{flex:1;min-width:0}
.meshCard .mt b{display:block;font-size:15px}
.meshCard .mt small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
#meshBox #cmdBar{margin:0 0 12px}
#meshDot{font-size:13px;margin-left:2px}
#meshDot.off{display:none}
#meshDot.warn{opacity:.35;filter:grayscale(1)}
select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:17px}
.apkBanner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;margin-bottom:10px;text-decoration:none;
  background:rgba(255,138,31,.1);border:1px solid rgba(255,138,31,.35);color:var(--text);font-size:22px}
.apkBanner b{display:block;font-size:15px}
.apkBanner small{display:block;font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#243040;
  color:var(--text);padding:12px 18px;border-radius:12px;font-size:14px;z-index:20;transition:opacity .2s;pointer-events:none}
</style>
</head>
<body>

<!-- 1. Vardas -->
<section id="scrName" class="scr hidden">
  <h1><span>311</span> VoiceCH</h1>
  <p class="muted">Kaip tave matys kiti kanalo nariai?</p>
  <div class="field">
    <label for="nameIn">Vardas</label>
    <input id="nameIn" autocomplete="name" maxlength="32" placeholder="pvz. Saulius">
  </div>
  <button class="btn" id="nameBtn">Toliau</button>
  <div class="err" id="nameErr"></div>
</section>

<!-- 2. Kanalų sąrašas -->
<section id="scrList" class="scr hidden">
  <div class="top">
    <div class="grow"><div class="brand"><span>311</span> VoiceCH</div><div class="hello" id="hello"></div></div>
    <button class="icon" id="adminBtn" aria-label="Administratorius">🛡️</button>
    <button class="ghost" id="logoutBtn">Atsijungti</button>
  </div>
  <div class="sec"><span>Mano kanalai</span></div>
  <div id="meshBox" class="hidden"></div>
  <ul id="chList"></ul>
  <div class="actions">
    <button class="btn" id="newChBtn">＋ Sukurti</button>
    <button class="btn alt" id="joinChBtn">Prisijungti</button>
  </div>
</section>

<!-- 3. Kanalas -->
<section id="scrChan" class="scr hidden">
  <div class="top">
    <button class="icon" id="backBtn" aria-label="Atgal">←</button>
    <div class="grow"><div class="chTitle"><span class="dot" id="dot"></span><span id="chName"></span></div>
      <div class="hello" id="chSub"></div></div>
    <button class="icon" id="inviteBtn" aria-label="Pakviesti">👥</button>
    <button class="icon" id="menuBtn" aria-label="Meniu">⋯</button>
  </div>

  <div id="status">Tylu</div>
  <div id="cmdBar">
    <button id="stopBtn"><span class="fill"></span><b>🚨 STOP VISIEMS</b><small>laikyk 1 s</small></button>
    <div id="cmdChips"></div>
  </div>
  <div id="pttWrap"><button id="ptt">KALBĖTI<small>laikyk nuspaudęs</small></button></div>

  <div class="sec"><span>Prisijungę (<b id="cnt">0</b>)</span></div>
  <div id="users"></div>
  <div class="sec"><span>Istorija</span></div>
  <ul id="hist"></ul>
</section>

<div id="modal" class="hidden"><div class="box" id="modalBox"></div></div>
<div id="alarm" class="hidden">
  <div class="big">🚨 STOP</div>
  <div class="txt" id="alarmTxt"></div>
  <div class="from" id="alarmFrom"></div>
  <button id="alarmOk">SUPRATAU</button>
</div>
<div id="cmdBanner" class="hidden"><b id="cbTxt"></b><small id="cbFrom"></small></div>
<div id="toast" style="opacity:0"></div>

<script>
const RATE = 16000;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vib = p => { try{ navigator.vibrate && navigator.vibrate(p) }catch{} };
const store = {
  get(k,d=null){ try{ const v=localStorage.getItem(k); return v===null?d:v }catch{ return d } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch{} },
  del(k){ try{ localStorage.removeItem(k) }catch{} }
};

// ---------- vietiniai duomenys ----------
let myName = store.get('racija_name','');
let token = store.get('racija_token');
if (!token){ token = [...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join(''); store.set('racija_token',token); }
let saved = (()=>{ try{ return JSON.parse(store.get('racija_channels','[]'))||[] }catch{ return [] } })();
const saveList = () => store.set('racija_channels', JSON.stringify(saved));
const findSaved = n => saved.find(c=>c.name===n);
function upsertSaved(obj){
  const c = findSaved(obj.name);
  if (c) Object.assign(c,obj); else saved.unshift({hiddenBefore:0, ...obj});
  saveList();
}

// ---------- ekranai ----------
function show(id){ ['scrName','scrList','scrChan'].forEach(s=>$(s).classList.toggle('hidden', s!==id)); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.opacity=1; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.opacity=0,2000); }
function openModal(html){ $('modalBox').innerHTML=html; $('modal').classList.remove('hidden'); const f=$('modalBox').querySelector('input'); if(f) setTimeout(()=>f.focus(),50); }
function closeModal(){ $('modal').classList.add('hidden'); $('modalBox').innerHTML=''; pending=null; }
$('modal').addEventListener('pointerdown', e=>{ if(e.target.id==='modal') closeModal(); });

// ---------- mu-law ----------
const MU = new Int16Array(256);
for (let i=0;i<256;i++){ const u=~i&0xff; let t=((u&0x0f)<<3)+0x84; t<<=(u&0x70)>>4; MU[i]=(u&0x80)?(0x84-t):(t-0x84); }
function linToMu(s){
  let sign=(s>>8)&0x80; if(sign) s=-s; if(s>32635) s=32635; s+=0x84;
  let exp=7; for(let mask=0x4000;(s&mask)===0&&exp>0;exp--,mask>>=1);
  const mant=(s>>(exp+3))&0x0f;
  return ~(sign|(exp<<4)|mant)&0xff;
}

// ---------- garsas ----------
let ctx=null, stream=null, gainOut=null, talking=false, playHead=0, dsPos=0;
let proc=null, micSrc=null, micChain=null, recBuf=null;
let noisy = store.get('vc_noisy','0')==='1';   // triukšmingos aplinkos režimas
async function initAudio(){
  ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
  if (ctx.state==='suspended') await ctx.resume();
  if (!gainOut){ gainOut=ctx.createGain(); gainOut.gain.value=1.4; gainOut.connect(ctx.destination); }
  if (!proc){
    proc = ctx.createScriptProcessor(4096,1,1);
    const mute = ctx.createGain(); mute.gain.value=0;
    proc.connect(mute); mute.connect(ctx.destination);
    proc.onaudioprocess = e => {
      const live = talking && ws && ws.readyState===1;
      if (!recBuf && !live) return;
      const out = encode(e.inputBuffer.getChannelData(0));
      if (!out.length) return;
      if (recBuf) recBuf.push(out); else ws.send(out);
    };
  }
}

// Mikrofonas atidaromas TIK kalbant / įrašant. Nuolat atidarytas mikrofonas laiko telefoną
// „pokalbio“ režime, ir garso mygtukai nustoja valdyti įprastą garsumą.
let micIdle=null, micOpening=null;
async function openMic(){
  await initAudio();
  clearTimeout(micIdle);
  if (stream) return;
  if (micOpening) return micOpening;
  micOpening = (async()=>{
    // triukšme: be automatinio garsumo kėlimo (šūviai nesustiprinami) + ribotuvas smūginiams garsams
    const s = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:!noisy}});
    stream = s;
    micSrc = ctx.createMediaStreamSource(stream);
    if (noisy){
      micChain = ctx.createDynamicsCompressor();
      micChain.threshold.value=-30; micChain.knee.value=6; micChain.ratio.value=12; micChain.attack.value=0.002; micChain.release.value=0.15;
      const boost = ctx.createGain(); boost.gain.value=2.2;
      micSrc.connect(micChain); micChain.connect(boost); boost.connect(proc);
      micChain._out = boost;
    } else {
      micChain = null; micSrc.connect(proc);
    }
  })();
  try{ await micOpening; } finally { micOpening=null; }
}
function closeMic(force){
  clearTimeout(micIdle);
  if (!force && (talking || recBuf || ptt.classList.contains('down'))) return;
  if (stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  try{ micSrc && micSrc.disconnect(); }catch{}
  try{ micChain && micChain._out.disconnect(); }catch{}
  micSrc=null; micChain=null;
  if (window.Native311 && Native311.audioIdle) setTimeout(()=>{ try{ Native311.audioIdle(); }catch{} }, 300);
}
function closeMicSoon(ms=1200){ clearTimeout(micIdle); micIdle=setTimeout(()=>closeMic(false), ms); }
async function restartMic(){ closeMic(true); }  // kitą kartą atsidarys su naujais nustatymais
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='hidden' && !talking && !recBuf) closeMic(true); });
function encode(input){
  const ratio = ctx.sampleRate / RATE, out = [];
  while (dsPos < input.length){
    const a=Math.floor(dsPos), b=Math.max(a+1, Math.min(input.length, Math.floor(dsPos+ratio)));
    let sum=0; for(let i=a;i<b;i++) sum+=input[i];
    const v=Math.max(-1,Math.min(1,sum/(b-a)));
    out.push(linToMu(Math.round(v*32767)));
    dsPos += ratio;
  }
  dsPos -= input.length;
  return new Uint8Array(out);
}
function playChunk(bytes){
  if (!ctx) return;
  const buf=ctx.createBuffer(1,bytes.length,RATE), d=buf.getChannelData(0);
  for (let i=0;i<bytes.length;i++) d[i]=MU[bytes[i]]/32768;
  const s=ctx.createBufferSource(); s.buffer=buf; s.connect(gainOut);
  const now=ctx.currentTime;
  if (playHead < now+0.03) playHead = now+0.2;
  s.start(playHead); playHead += buf.duration;
}
function beep(freq, at=0, dur=0.07){
  if (!ctx) return;
  const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=freq;
  const t=Math.max(ctx.currentTime,at);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+0.02);
}

// ---------- ryšys ----------
let ws=null, cur=null /* {name,pw,owner,ticket} */, pending=null, rxFrom=null, talkerName=null, reconnectTimer=null;
let wantOpen=false, sendQueue=[], me={id:0,owner:false,admin:false}, lastUsers=[];
let adminKey = store.get('racija_admin','');
const joinMsg = c => c.viaAdmin
  ? {t:'adminJoin', name:myName, channel:c.name, token}
  : {t:'join', name:myName, channel:c.name, password:c.pw, token};
function ensureWs(){
  if (ws && (ws.readyState===0 || ws.readyState===1)) return;
  clearTimeout(reconnectTimer);
  const proto = location.protocol==='https:'?'wss':'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType='arraybuffer';
  ws.onopen = () => {
    $('dot').classList.add('on');
    if (adminKey) ws.send(JSON.stringify({t:'admin', key:adminKey}));
    if (cur && !pending) ws.send(JSON.stringify(joinMsg(cur)));
    sendQueue.splice(0).forEach(m=>ws.send(m));
  };
  ws.onclose = () => {
    $('dot').classList.remove('on');
    if (talking) stopTalk(true);
    if (wantOpen) reconnectTimer=setTimeout(ensureWs, 2000);
  };
  ws.onmessage = onMsg;
}
function wsSend(obj){
  const s=JSON.stringify(obj);
  if (ws && ws.readyState===1) ws.send(s); else { sendQueue.push(s); ensureWs(); }
}

function onMsg(ev){
  if (ev.data instanceof ArrayBuffer){ playChunk(new Uint8Array(ev.data)); return; }
  const m = JSON.parse(ev.data);
  switch(m.t){
    case 'joined': {
      if (!pending && !cur){ wsSend({t:'leave'}); return; } // vartotojas atšaukė
      const prev = findSaved(m.channel) || {};
      const src = pending || cur || {};
      const pw = src.pw ?? prev.pw ?? null;
      const viaAdmin = !!src.viaAdmin;
      cur = { name:m.channel, pw, viaAdmin, owner:m.owner, ticket:m.ticket };
      me.owner = m.owner; me.admin = m.admin;
      upsertSaved({ name:m.channel, pw, viaAdmin, owner:m.owner, last:Date.now() });
      if (pending){ closeModal(); }
      enterChannelUI(m.history);
      break;
    }
    case 'error':
      if (m.code==='badadmin' || m.code==='noadmin'){
        adminKey=''; store.del('racija_admin');
        if (!pending) { toast(m.msg); break; }
      }
      if (pending && pending.fromSaved && m.code==='notfound'){
        const c=pending.fromSaved; pending=null;
        openModal(`<h2>#${esc(c.name)} nerastas</h2>
          <p class="muted">Kanalas ištrintas arba dingo serveryje.${c.pw?' Gali jį sukurti iš naujo su tuo pačiu slaptažodžiu, tada seni kvietimai vėl veiks.':''}</p>
          ${c.pw?'<button class="btn" id="mRe">Sukurti iš naujo</button>':''}
          <button class="btn danger" id="mRm">Pašalinti iš sąrašo</button>
          <button class="btn alt" onclick="closeModal()">Uždaryti</button><div class="err" id="mErr"></div>`);
        if ($('mRe')) $('mRe').onclick=()=>{ $('mRe').disabled=true; pending={pw:c.pw}; wsSend({t:'create', name:myName, channel:c.name, password:c.pw, token}); };
        $('mRm').onclick=()=>{ saved=saved.filter(x=>x.name!==c.name); saveList(); closeModal(); renderList(); };
        break;
      }
      if (pending){ const e=$('mErr'); if(e) e.textContent=m.msg; const b=$('mOk'); if(b) b.disabled=false; }
      else if (m.code==='badpass' || m.code==='notfound'){
        // pvz. pakeistas slaptažodis ar ištrintas kanalas
        const n=cur&&cur.name; cur=null; show('scrList'); renderList();
        toast(m.code==='badpass' ? `#${n}: slaptažodis pasikeitė` : `#${n}: kanalas nebeegzistuoja`);
      } else toast(m.msg);
      break;
    case 'presence':
      talkerName=m.talker; me=m.me;
      if (cur && cur.owner!==m.me.owner){ cur.owner=m.me.owner; upsertSaved({name:cur.name, owner:cur.owner}); renderChSub(); }
      renderUsers(m.users); updateStatus(); break;
    case 'toast': toast(m.msg); break;
    case 'adminOk':
      if (pending && pending.adminAuth){ adminKey=pending.key; store.set('racija_admin',adminKey); pending=null; wsSend({t:'adminList'}); }
      break;
    case 'adminList': renderAdmin(m.channels); break;
    case 'adminDone':
      toast(m.msg);
      if (m.action==='adminDelete'){ saved=saved.filter(c=>c.name!==m.channel); saveList(); renderList(); }
      if (m.action==='adminPassword' && pending && pending.pwFor===m.channel){ const s=findSaved(m.channel); if(s){ s.pw=pending.pw; saveList(); } }
      pending=null; renderAdmin(m.channels); break;
    case 'granted':
      if (cmdAudio){ sendStoredAudio(cmdAudio); cmdAudio=null; break; }
      if ($('ptt').classList.contains('down')){ talking=true; dsPos=0; beep(880); vib(30); updateStatus(); } else wsSend({t:'stop'}); break;
    case 'busy':
      vib([60,40,60]); flash(`Užimta: kalba ${m.by}`); $('ptt').classList.remove('down');
      if (cmdAudio){ cmdAudio=null; } break;
    case 'start':
      rxFrom=m.from; beep(660); vib(20);
      if (m.cmd && !recentCmd(m.from, m.cmd)) showCmd(m.from, m.cmd, true);
      updateStatus(); break;
    case 'cmd':
      if (m.item) addHist(m.item);
      cmdSeen = {from:m.from, text:m.text, at:Date.now()};
      if (Date.now()-lastSentCmd < 3000 && m.from===myName){ toast(`${m.alarm?'🚨':'📢'} Išsiųsta: ${m.text}`); break; }
      if (!seenCid(m.cid)) break;               // jau gauta per LoRa
      if (m.alarm) showAlarm(m.from, m.text, m.cid); else showCmd(m.from, m.text, m.voice);
      break;
    case 'stop':
      if (rxFrom===m.from){ beep(440, playHead); rxFrom=null; }
      if (m.forced && talking){ stopTalk(true); if (m.forced!=='alarm') flash('Pasiektas 60 s limitas'); }
      if (m.item) addHist(m.item);
      updateStatus(); break;
    case 'cleared': $('hist').innerHTML=''; renderHistEmpty(); toast('Istorija išvalyta'); break;
    case 'deleted': {
      saved = saved.filter(c=>c.name!==m.channel); saveList();
      cur=null; show('scrList'); renderList(); toast(`Kanalas #${m.channel} ištrintas`); break;
    }
    case 'passwordChanged': {
      if (pending && cur){ cur.pw=pending.pw; upsertSaved({name:cur.name, pw:cur.pw}); closeModal(); toast('Slaptažodis pakeistas. Pakviesk narius iš naujo.'); }
      break;
    }
  }
}

// bendras komandos id: 4 simboliai = minutė (base36), 2 = atsitiktiniai. Pagal jį šalinami dublikatai ir senos žinutės.
function newCid(){
  const min = Math.floor(Date.now()/60000) % (36**4);
  return min.toString(36).padStart(4,'0') + Math.floor(Math.random()*1296).toString(36).padStart(2,'0');
}
const seenIds = new Map();
function seenCid(cid){            // true, jei naujas
  if (!cid) return true;
  if (seenIds.has(cid)) return false;
  seenIds.set(cid, Date.now());
  if (seenIds.size>300) seenIds.delete(seenIds.keys().next().value);
  // programėlė galėjo tą pačią žinutę jau gauti per LoRa (ir paleisti sireną)
  if (NATIVE) try{ if (Native311.markSeen(cid)===false) return false; }catch{}
  return true;
}
function sendCmd(c){
  const online = ws && ws.readyState===1 && cur && scrVisible('scrChan');
  const lora = meshReady();
  if (!online && !lora){ flash('Nėra ryšio'); return; }
  const cid = newCid(); seenCid(cid);
  lastSentCmd = Date.now();
  let via=[];
  if (online){ wsSend({t:'cmd', text:c.text, alarm:!!c.alarm, voice:!!c.audio, cid}); via.push('internetu'); }
  if (lora){
    const msg = `${c.alarm?'🚨':'📢'} ${c.text} · ${myName} #${cid}`;
    try{ if (Native311.meshSend(msg, cid)) via.push('LoRa'); }catch{}
  }
  vib(c.alarm ? [100,50,100] : 40);
  if (!online) toast(`${c.alarm?'🚨':'📢'} Išsiųsta ${via.join(' + ')}: ${c.text}`);
  if (online && c.audio && !talking){ cmdAudio=c; wsSend({t:'start', cmd:c.text}); }
}
function sendStoredAudio(c){
  const a=b64dec(c.audio);
  for (let i=0;i<a.length;i+=3200) ws.send(a.subarray(i,i+3200));
  wsSend({t:'stop'});
}

let sirenNodes=[];
function siren(sec=3){
  if (!ctx) return;
  const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime;
  o.type='square'; g.gain.value=0.35;
  for (let i=0;i<sec*2;i++){ o.frequency.setValueAtTime(700,t+i*0.5); o.frequency.linearRampToValueAtTime(1500,t+i*0.5+0.45); }
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+sec);
  sirenNodes.push(o);
}
function stopSiren(){ sirenNodes.forEach(o=>{ try{o.stop()}catch{} }); sirenNodes=[]; }
function showAlarm(from, text, cid, nativeDone){
  $('alarmTxt').textContent = text;
  $('alarmFrom').textContent = '— ' + from;
  $('alarm').classList.remove('hidden');
  if (NATIVE){ if (!nativeDone) try{ Native311.alarmId(text, from, cid||''); }catch{ siren(3); } } else siren(3);
  vib([600,200,600,200,600,200,1200]);
}
$('alarmOk').onclick = () => {
  $('alarm').classList.add('hidden'); stopSiren(); vib(0);
  if (NATIVE) try{ Native311.alarmStop(); }catch{}
};
function showCmd(from, text, voice){
  $('cbTxt').textContent = '📢 ' + text;
  $('cbFrom').textContent = from;
  $('cmdBanner').classList.remove('hidden');
  clearTimeout(showCmd.t); showCmd.t=setTimeout(()=>$('cmdBanner').classList.add('hidden'), 4500);
  beep(988); beep(1319, ctx?ctx.currentTime+0.12:0);
  vib([80,60,80]);
  if (!voice) speak(text);
}
$('cmdBanner').onclick = () => $('cmdBanner').classList.add('hidden');
function speak(text){
  try{
    if (!('speechSynthesis' in window)) return;
    const u=new SpeechSynthesisUtterance(text);
    const v=speechSynthesis.getVoices().find(v=>/^lt/i.test(v.lang));
    if (v) u.voice=v; u.lang = v ? v.lang : 'lt-LT'; u.rate=1.05;
    speechSynthesis.speak(u);
  }catch{}
}

    };
    const stop = () => {
      if (!recBuf) return;
      clearTimeout(tm); rec.classList.remove('on');
      setTimeout(()=>{ // paskutinis garso blokas

        if (len < RATE*0.4){ toast('Per trumpa – laikyk mygtuką kalbėdamas'); return; }

        c.audio=b64enc(all); saveCmds(); renderCmdChips(); toast('Įrašyta: '+c.text); cmdEditor();

    rec.addEventListener('pointerdown', start);
    rec.addEventListener('pointerup', stop); rec.addEventListener('pointercancel', stop); rec.addEventListener('pointerleave', stop);

  $('cmdReset').onclick = () => { cmds=DEFAULT_CMDS.map(c=>({...c})); saveCmds(); renderCmdChips(); cmdEditor(); };
}

  if (alarm) showAlarm(from+' · LoRa', text, cid, alarmHandled); else showCmd(from+' · LoRa', text, false);

    ${st.state!=='off'?`<button class="btn danger" id="mOff">Atjungti mazgą</button>`:''}
    <p class="muted" style="font-size:13px">Prie mazgo vienu metu gali būti prijungta tik viena programėlė, todėl oficiali Meshtastic programėlė turi būti atjungta. Visi instruktoriai turi naudoti tą patį Meshtastic kanalą ir raktą.</p>
    <button class="btn alt" onclick="closeModal()">Uždaryti</button>`;
  if ($('mPerm')) $('mPerm').onclick = () => Native311.meshRequestPerm();
  $('mBt').onclick = () => Native311.openBtSettings();
  $('mCh').onchange = e => Native311.meshSetChannel(+e.target.value);
  $('modalBox').querySelectorAll('.meshDev').forEach(b=>b.onclick=()=>{ Native311.meshConnect(b.dataset.a); toast('Jungiamasi…'); });
  if ($('mTest')) $('mTest').onclick = () => { const cid=newCid(); seenCid(cid); const ok=Native311.meshSend(`📢 Bandymas · ${myName} #${cid}`, cid); toast(ok?'Bandomoji žinutė išsiųsta per LoRa':'Nepavyko išsiųsti'); };
  if ($('mOff')) $('mOff').onclick = () => Native311.meshDisconnect();
}
if (NATIVE){ setTimeout(meshRefresh, 800); setInterval(meshRefresh, 5000); }

// sąsaja veikia ir be interneto (išsaugoma telefone)
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

// ---------- startas ----------
let inviteData=null;
(()=>{
  const q=new URLSearchParams(location.search);
  if (q.get('c')){ inviteData={c:q.get('c'), k:q.get('k')||''}; history.replaceState(null,'',location.pathname); }
  if (myName) afterName(); else show('scrName');
})();
</script>
